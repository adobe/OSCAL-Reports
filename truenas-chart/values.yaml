# Default values for OSCAL Report Generator
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @section Global Settings
##
global:
  ## @param global.nameOverride Override the name of the chart
  nameOverride: ""
  ## @param global.fullnameOverride Override the fullname of the chart
  fullnameOverride: ""

## @section Image Settings
##
image:
  ## @param image.repository Docker image repository
  repository: keekar/oscal_reports
  ## @param image.tag Image tag (defaults to chart appVersion)
  tag: "latest"
  ## @param image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent

## @section Application Settings
##
app:
  ## @param app.nodeEnv Node environment (production/development)
  nodeEnv: production
  ## @param app.port Application port
  port: 3020

## @section Service Settings
##
service:
  ## @param service.type Service type
  type: NodePort
  ## @param service.port Service port
  port: 3020
  ## @param service.nodePort Node port (30000-32767)
  nodePort: 30200
  ## @param service.protocol Service protocol
  protocol: TCP

## @section Ingress Settings (optional)
##
ingress:
  ## @param ingress.enabled Enable ingress controller resource
  enabled: false
  ## @param ingress.className Ingress class name
  className: ""
  ## @param ingress.annotations Additional annotations for the Ingress resource
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  ## @param ingress.hosts Ingress hosts configuration
  hosts:
    - host: oscal.local
      paths:
        - path: /
          pathType: Prefix
  ## @param ingress.tls Ingress TLS configuration
  tls: []
  #  - secretName: oscal-tls
  #    hosts:
  #      - oscal.local

## @section Storage Settings
##
persistence:
  ## @param persistence.enabled Enable persistent storage
  enabled: true
  ## @param persistence.existingClaim Use existing PVC
  existingClaim: ""
  ## @param persistence.storageClass Storage class
  storageClass: ""
  ## @param persistence.accessMode Access mode
  accessMode: ReadWriteOnce
  ## @param persistence.size Storage size
  size: 1Gi
  ## @param persistence.hostPath Host path (for local storage)
  hostPath: ""
  ## @param persistence.mountPath Container mount path
  mountPath: /app/config

## @section Resource Limits
##
resources:
  ## @param resources.limits Resource limits
  limits:
    cpu: 1000m
    memory: 1Gi
  ## @param resources.requests Resource requests
  requests:
    cpu: 100m
    memory: 256Mi

## @section Health Checks
##
healthcheck:
  ## @param healthcheck.enabled Enable health checks
  enabled: true
  ## @param healthcheck.livenessProbe Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 3020
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param healthcheck.readinessProbe Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health
      port: 3020
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

## @section Security Context
##
securityContext:
  ## @param securityContext.runAsNonRoot Run container as non-root user
  runAsNonRoot: false
  ## @param securityContext.runAsUser User ID to run the container
  runAsUser: 0
  ## @param securityContext.fsGroup Group ID for filesystem access
  fsGroup: 0

## @section Pod Settings
##
podAnnotations: {}
podSecurityContext: {}

## @section Deployment Strategy
##
strategy:
  ## @param strategy.type Deployment strategy type
  type: RollingUpdate
  ## @param strategy.rollingUpdate Rolling update configuration
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

## @section Node Selection
##
nodeSelector: {}
tolerations: []
affinity: {}

## @section Additional Settings
##
## @param replicaCount Number of replicas
replicaCount: 1

## @param autoscaling.enabled Enable autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

## @param serviceAccount.create Create service account
serviceAccount:
  create: false
  annotations: {}
  name: ""

## @param environmentVariables Additional environment variables
environmentVariables: []
  # - name: CUSTOM_VAR
  #   value: "custom_value"
