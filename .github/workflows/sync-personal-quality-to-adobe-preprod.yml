# One-click: Actions → Run workflow → sync keekar2022 Quality → this repo Pre_Prod.
# Runs only on AdobeManagedServices/OSCAL-Reports (skipped on personal fork).
#
# Secrets (Adobe repo):
#   PERSONAL_REPO_READ_TOKEN — must be a PAT for a GitHub user that CAN READ keekar2022/OSCAL-Reports
#   (private repo: use your personal account PAT, or add the Adobe user as collaborator). SSO: authorize token for keekar2022.
# Optional: ADOBE_REPO_PUSH_TOKEN if branch protection blocks GITHUB_TOKEN pushes to Pre_Prod.
# Optional repo variable PERSONAL_SOURCE_REPO (e.g. owner/name) if the fork path is not keekar2022/OSCAL-Reports.

name: Sync personal Quality to Pre_Prod

on:
  workflow_dispatch:

concurrency:
  group: sync-personal-quality-to-adobe-preprod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward Pre_Prod from personal Quality
    if: github.repository == 'AdobeManagedServices/OSCAL-Reports'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pre_Prod
        uses: actions/checkout@v4
        with:
          ref: Pre_Prod
          fetch-depth: 0
          token: ${{ secrets.ADOBE_REPO_PUSH_TOKEN || github.token }}

      - name: Configure git author
        run: |
          git config user.name "Mukesh Kesharwani"
          git config user.email "mukesh.kesharwani@adobe.com"

      - name: Verify PAT can read personal repository
        env:
          PERSONAL_REPO_READ_TOKEN: ${{ secrets.PERSONAL_REPO_READ_TOKEN }}
          PERSONAL_REPO_FULL_NAME: ${{ vars.PERSONAL_SOURCE_REPO }}
        run: |
          set -euo pipefail
          REPO="${PERSONAL_REPO_FULL_NAME:-keekar2022/OSCAL-Reports}"
          if [ -z "${PERSONAL_REPO_READ_TOKEN}" ]; then
            echo '::error::PERSONAL_REPO_READ_TOKEN is empty. Add it under Settings → Secrets and variables → Actions.'
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${PERSONAL_REPO_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}")"
          if [ "${code}" != "200" ]; then
            echo "::error::GitHub API returned HTTP ${code} for ${REPO}. The token owner must have read access to that repo (private repos: use a PAT from your personal GitHub user, or invite the Adobe user as read collaborator). For SAML orgs, open the token in GitHub settings and click Authorize SSO."
            exit 1
          fi
          echo "OK: token can read ${REPO}."

      - name: Fast-forward merge personal Quality
        env:
          PERSONAL_REPO_READ_TOKEN: ${{ secrets.PERSONAL_REPO_READ_TOKEN }}
          PERSONAL_REPO_FULL_NAME: ${{ vars.PERSONAL_SOURCE_REPO }}
        run: |
          chmod +x scripts/git/ff-sync-preprod-from-personal-quality.sh
          ./scripts/git/ff-sync-preprod-from-personal-quality.sh

      - name: Push Pre_Prod
        run: git push origin Pre_Prod
