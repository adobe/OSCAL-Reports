# Two ways to get personal branch Quality onto Adobe Pre_Prod (same workflow file, different jobs):
#
# 1) Adobe repo — workflow_dispatch — "pull" strategy
#    Checkout Adobe Pre_Prod, fetch personal Quality, fast-forward merge, push.
#    Runs on GitHub-hosted ubuntu-latest. Secrets: PERSONAL_REPO_READ_TOKEN, optional ADOBE_REPO_PUSH_TOKEN.
#
# 2) Personal repo — push to Quality OR workflow_dispatch — "push" strategy
#    Checkout personal Quality, git push to Adobe Pre_Prod.
#    Requires self-hosted runner [self-hosted, oscal-mirror] and ADOBE_REPO_PUSH_TOKEN.
#    If no runner is registered, use job (1) from the Adobe repo instead.

name: Sync Quality to Adobe Pre_Prod

on:
  workflow_dispatch:
  push:
    branches:
      - Quality

concurrency:
  group: quality-to-adobe-preprod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-forward-on-adobe:
    name: Fast-forward Pre_Prod from personal Quality (Adobe)
    if: github.repository == 'AdobeManagedServices/OSCAL-Reports' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pre_Prod
        uses: actions/checkout@v4
        with:
          ref: Pre_Prod
          fetch-depth: 0
          token: ${{ secrets.ADOBE_REPO_PUSH_TOKEN || github.token }}

      - name: Configure git author
        run: |
          git config user.name "Mukesh Kesharwani"
          git config user.email "mukesh.kesharwani@adobe.com"

      - name: Verify PAT can read personal repository
        env:
          PERSONAL_REPO_READ_TOKEN: ${{ secrets.PERSONAL_REPO_READ_TOKEN }}
          PERSONAL_REPO_FULL_NAME: ${{ vars.PERSONAL_SOURCE_REPO }}
        run: |
          set -euo pipefail
          REPO="${PERSONAL_REPO_FULL_NAME:-keekar2022/OSCAL-Reports}"
          if [ -z "${PERSONAL_REPO_READ_TOKEN}" ]; then
            echo '::error::PERSONAL_REPO_READ_TOKEN is empty. Add it under Settings → Secrets and variables → Actions.'
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${PERSONAL_REPO_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}")"
          if [ "${code}" != "200" ]; then
            echo "::error::GitHub API returned HTTP ${code} for ${REPO}. The token owner must have read access to that repo (private repos: use a PAT from your personal GitHub user, or invite the Adobe user as read collaborator). For SAML orgs, open the token in GitHub settings and click Authorize SSO."
            exit 1
          fi
          echo "OK: token can read ${REPO}."

      - name: Fast-forward merge personal Quality
        env:
          PERSONAL_REPO_READ_TOKEN: ${{ secrets.PERSONAL_REPO_READ_TOKEN }}
          PERSONAL_REPO_FULL_NAME: ${{ vars.PERSONAL_SOURCE_REPO }}
        run: |
          chmod +x scripts/git/ff-sync-preprod-from-personal-quality.sh
          ./scripts/git/ff-sync-preprod-from-personal-quality.sh

      - name: Push Pre_Prod
        run: git push origin Pre_Prod

  push-from-personal:
    name: Push Quality to Adobe Pre_Prod (personal)
    if: github.repository == 'keekar2022/OSCAL-Reports' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, oscal-mirror]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Self-hosted runner context
        run: |
          echo "Using self-hosted runner labels: self-hosted, oscal-mirror"
          echo "If this job queues longer than 30 minutes, the runner is offline."
          echo "Fallback: AdobeManagedServices/OSCAL-Reports → Actions → Sync Quality to Adobe Pre_Prod → Run workflow"

      - name: Checkout Quality
        uses: actions/checkout@v4
        with:
          ref: Quality
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "Mukesh Kesharwani"
          git config user.email "mukesh.kesharwani@adobe.com"

      - name: Push to Adobe Pre_Prod
        env:
          ADOBE_REPO_PUSH_TOKEN: ${{ secrets.ADOBE_REPO_PUSH_TOKEN }}
        run: |
          if [ -z "${ADOBE_REPO_PUSH_TOKEN}" ]; then
            echo "::error::ADOBE_REPO_PUSH_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, or use Adobe-side workflow_dispatch (Sync Quality to Adobe Pre_Prod on AdobeManagedServices/OSCAL-Reports)."
            exit 1
          fi
          git remote remove adobe 2>/dev/null || true
          git remote add adobe "https://x-access-token:${ADOBE_REPO_PUSH_TOKEN}@github.com/AdobeManagedServices/OSCAL-Reports.git"
          git push adobe HEAD:Pre_Prod

  sync-fallback-hint:
    name: Adobe sync fallback instructions
    runs-on: ubuntu-latest
    needs: [push-from-personal]
    if: always() && github.repository == 'keekar2022/OSCAL-Reports' && github.event_name == 'push'

    steps:
      - name: Post sync guidance
        run: |
          {
            echo "## Quality → Adobe Pre_Prod sync"
            if [ "${{ needs.push-from-personal.result }}" = "success" ]; then
              echo "Self-hosted mirror push succeeded."
            else
              echo "Self-hosted mirror push result: **${{ needs.push-from-personal.result }}**"
              echo ""
              echo "If the mirror job was **queued** or **timed out**, use the Adobe-side pull sync instead:"
              echo "1. Open **AdobeManagedServices/OSCAL-Reports** → Actions"
              echo "2. Run **Sync Quality to Adobe Pre_Prod** (workflow_dispatch)"
              echo "3. Ensure \`PERSONAL_REPO_READ_TOKEN\` and \`ADOBE_REPO_PUSH_TOKEN\` are set on the Adobe repo"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
