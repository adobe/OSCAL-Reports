# Release validation for adobe/OSCAL-Reports (single Main branch).
name: Adobe PreProd Validation

on:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

jobs:
  version-check:
    name: Validate Version Increment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: 🔍 Get latest tag version
        id: latest_tag
        run: |
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found, this is the first release"
            echo "tag_version=0.0.0" >> $GITHUB_OUTPUT
            echo "has_tag=false" >> $GITHUB_OUTPUT
          else
            TAG_VERSION=${LATEST_TAG#v}
            echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "has_tag=true" >> $GITHUB_OUTPUT
            echo "Latest tag version: $TAG_VERSION"
          fi

      - name: 🧮 Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest_tag.outputs.tag_version }}"
          HAS_TAG="${{ steps.latest_tag.outputs.has_tag }}"
          echo "Comparing versions:"
          echo "  Current: $CURRENT"
          echo "  Latest:  $LATEST"
          compare_versions() {
            local ver1=$1
            local ver2=$2
            IFS='.' read -r major1 minor1 patch1 <<< "$ver1"
            IFS='.' read -r major2 minor2 patch2 <<< "$ver2"
            if [ "$major1" -gt "$major2" ]; then return 0
            elif [ "$major1" -lt "$major2" ]; then return 1
            fi
            if [ "$minor1" -gt "$minor2" ]; then return 0
            elif [ "$minor1" -lt "$minor2" ]; then return 1
            fi
            if [ "$patch1" -gt "$patch2" ]; then return 0
            elif [ "$patch1" -lt "$patch2" ]; then return 1
            fi
            return 2
          }
          if [ "$HAS_TAG" == "false" ]; then
            echo "✅ No previous tags found - first release"
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "message=First release detected (v$CURRENT)" >> $GITHUB_OUTPUT
            exit 0
          fi
          compare_versions "$CURRENT" "$LATEST"
          RESULT=$?
          if [ $RESULT -eq 0 ]; then
            echo "✅ Version has been incremented: $LATEST → $CURRENT"
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "message=Version correctly incremented from $LATEST to $CURRENT" >> $GITHUB_OUTPUT
          elif [ $RESULT -eq 2 ]; then
            echo "❌ Version has NOT been incremented!"
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "message=Version must be incremented. Current: $CURRENT, Latest: $LATEST" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "❌ Version has been DECREMENTED!"
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "message=Version cannot be less than latest tag. Current: $CURRENT, Latest: $LATEST" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: ✅ Version check passed
        if: success()
        run: |
          echo "================================"
          echo "✅ VERSION CHECK PASSED"
          echo "================================"

      - name: ❌ Version check failed
        if: failure()
        run: |
          echo "❌ VERSION CHECK FAILED — bump with ./scripts/bump_version.sh"
          exit 1

      - name: 📝 Comment on PR (if PR event)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const currentVersion = '${{ steps.current.outputs.version }}';
            const latestVersion = '${{ steps.latest_tag.outputs.tag_version }}';
            const isValid = '${{ steps.compare.outputs.valid }}' === 'true';
            let body = '## 🔢 Version Check\n\n';
            if (isValid) {
              body += '✅ **Version check passed!**\n\n';
              body += `- Previous: \`${latestVersion}\` → Current: \`${currentVersion}\`\n`;
            } else {
              body += '❌ **Version check failed.** Run scripts/bump_version.sh (patch, minor, or major).\n';
            }
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Could not create comment:', error.message);
            }

  changelog-check:
    name: Validate Changelog Updated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Check if CHANGELOG.md was updated
        id: changelog
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch origin $BASE_REF
            BASE="origin/$BASE_REF"
          else
            BASE="HEAD^"
          fi
          if git diff --name-only $BASE HEAD | grep -q "docs/CHANGELOG.md"; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
          CURRENT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          if [ -f "docs/CHANGELOG.md" ] && grep -q "\[$CURRENT_VERSION\]" docs/CHANGELOG.md; then
            echo "version_in_changelog=true" >> $GITHUB_OUTPUT
          else
            echo "version_in_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚠️ Changelog warning
        if: steps.changelog.outputs.updated == 'false' || steps.changelog.outputs.version_in_changelog == 'false'
        run: |
          echo "⚠️ Changelog: update docs/CHANGELOG.md or ensure version entry exists (non-blocking for this step)"

      - name: 📝 Comment on PR about changelog
        if: github.event_name == 'pull_request' && (steps.changelog.outputs.updated == 'false' || steps.changelog.outputs.version_in_changelog == 'false')
        uses: actions/github-script@v9
        with:
          script: |
            const body = '## 📝 Changelog\n\n⚠️ Update `docs/CHANGELOG.md` or add version entry — use `./scripts/bump_version.sh`.';
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) { console.log(e.message); }

  package-consistency:
    name: Validate Package.json Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Check version consistency
        run: |
          ROOT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          BACKEND_VERSION=$(grep '"version":' backend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          FRONTEND_VERSION=$(grep '"version":' frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ "$ROOT_VERSION" != "$BACKEND_VERSION" ] || [ "$ROOT_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "❌ Version mismatch across package.json files"
            exit 1
          fi
          echo "✅ Consistent version: $ROOT_VERSION"

  yaml-validation:
    name: Validate Workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Validate YAML syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/ci/validate_workflow_yaml.py
          echo "✅ All workflow YAML files valid"

      - name: 🔍 Check for hardcoded version numbers
        run: |
          if grep -r -E '"[0-9]+\.[0-9]+\.[0-9]+"' .github/workflows/ | grep -v 'node-version' | grep -v 'uses:' | grep -v '#' | grep -v 'github'; then
            echo "⚠️ WARNING: possible hardcoded versions in workflows"
          else
            echo "✅ No suspicious hardcoded versions"
          fi

  tar-syntax-check:
    name: Validate Tar Commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Check tar command syntax in release.yml
        run: |
          BAD_TAR=$(
            awk '
              /^[[:space:]]*tar[[:space:]]/ {
                if (block != "") {
                  first = block; sub(/\n.*/, "", first)
                  if (first ~ /tar[[:space:]]+-czf/ && first !~ /tar[[:space:]]+--exclude/ && block ~ /--exclude/) { print "BAD"; exit 0 }
                }
                block = $0; next
              }
              block != "" { block = block "\n" $0; next }
              END {
                if (block != "") {
                  first = block; sub(/\n.*/, "", first)
                  if (first ~ /tar[[:space:]]+-czf/ && first !~ /tar[[:space:]]+--exclude/ && block ~ /--exclude/) { print "BAD"; exit 0 }
                }
              }
            ' .github/workflows/release.yml
          )
          if [ -n "$BAD_TAR" ]; then
            echo "❌ tar: --exclude must come before -czf"; exit 1
          fi

      - name: 🔍 Test tar exclude
        run: |
          mkdir -p test_backend/auth test_backend/node_modules
          echo t > test_backend/server.js
          echo x > test_backend/node_modules/p.json
          tar --exclude=test_backend/node_modules -czf test-archive.tar.gz test_backend/
          if tar -tzf test-archive.tar.gz | grep -q node_modules; then exit 1; fi
          rm -rf test_backend test-archive.tar.gz

  eslint-config-check:
    name: Validate ESLint Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 ESLint config files
        run: |
          for f in eslint.config.js backend/eslint.config.js frontend/eslint.config.js; do
            [ -f "$f" ] && echo "✅ $f" || echo "⚠️ missing $f"
          done

  documentation-check:
    name: Check Documentation Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Required docs
        run: |
          for doc in README.md docs/CHANGELOG.md docs/GIT_AND_RELEASE.md docs/DEPLOYMENT_AND_OPERATIONS.md; do
            [ -f "$doc" ] && echo "✅ $doc" || echo "⚠️ missing $doc"
          done

  adobe-validation-summary:
    name: Adobe Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - version-check
      - changelog-check
      - package-consistency
      - yaml-validation
      - tar-syntax-check
      - eslint-config-check
      - documentation-check
    if: always() && github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📊 Summary
        run: |
          echo "## Adobe PreProd validation" >> $GITHUB_STEP_SUMMARY
          echo "- semver: ${{ needs.version-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- changelog: ${{ needs.changelog-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- package.json: ${{ needs.package-consistency.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- yaml: ${{ needs.yaml-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- tar: ${{ needs.tar-syntax-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- eslint config: ${{ needs.eslint-config-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- docs: ${{ needs.documentation-check.result }}" >> $GITHUB_STEP_SUMMARY

  auto-tag:
    name: Auto-create Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-check, changelog-check, package-consistency]
    if: github.repository == 'adobe/OSCAL-Reports' && github.event_name == 'push' && github.ref == 'refs/heads/Quality'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Get current version
        id: version
        run: |
          VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🏷️ Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create version tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f "docs/CHANGELOG.md" ]; then
            CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" docs/CHANGELOG.md | sed '$d' | tail -n +2)
            [ -z "$CHANGELOG" ] && CHANGELOG="Release v$VERSION"
          else
            CHANGELOG="Release v$VERSION"
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" -m "$CHANGELOG"
          git push origin "v$VERSION"

      - name: ℹ️ Tag already exists
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag v${{ steps.version.outputs.version }} exists — skip"
