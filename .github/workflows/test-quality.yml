name: Quality_Test Branch Tests

on:
  push:
    branches:
      - Quality_Test
  pull_request:
    branches:
      - Quality_Test
    types: [opened, synchronize, reopened]

jobs:
  security-audit:
    name: Security Audit & Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Run npm audit
        run: |
          npm audit --production || true
          cd backend && npm audit --production || true
          cd ../frontend && npm audit --production || true
      
      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --moderate || true

  comprehensive-security-tests:
    name: Comprehensive Security Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run All Security Tests
        run: |
          cd backend
          npm run test -- --testPathPattern='(csrf|ssrf|url|auth|roles).*\.test\.js'
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
          TEST_USER_PASSWORD: User@2026
          TEST_ASSESSOR_PASSWORD: Assessor@2026
      
      - name: Generate Security Test Report
        if: always()
        run: |
          echo "Security Test Results" > security-report.txt
          echo "=====================" >> security-report.txt
          echo "" >> security-report.txt
          cat backend/coverage/coverage-summary.json >> security-report.txt || true
      
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-report
          path: security-report.txt

  full-integration-suite:
    name: Full Integration Test Suite
    runs-on: ubuntu-latest
    needs: comprehensive-security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run All Integration Tests
        run: |
          cd backend
          npm run test:integration
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
          TEST_USER_PASSWORD: User@2026
      
      - name: Generate Coverage Report
        run: |
          cd backend
          npm run test:coverage
        env:
          NODE_ENV: test
      
      # Note: codecov/codecov-action is not allowed by Adobe organization policy
      # Coverage reports are uploaded as artifacts instead
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-quality-test
          path: ./backend/coverage/
          retention-days: 14

  email-and-messaging-tests:
    name: Email & Messaging Tests
    runs-on: ubuntu-latest
    needs: comprehensive-security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Test Email Functionality
        run: |
          cd backend
          npm run test -- --testPathPattern=email-functionality.test.js
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
      
      - name: Test Messaging Service
        run: |
          cd backend
          node --experimental-vm-modules -e "
          import { testEmailConfig } from './messagingService.js';
          
          console.log('Testing email service configuration...');
          const result = await testEmailConfig({
            enabled: true,
            smtpHost: 'smtp.gmail.com',
            smtpPort: 587,
            smtpSecure: false,
            smtpUser: 'test@example.com',
            smtpPassword: 'invalid',
            fromEmail: 'test@example.com',
            fromName: 'Test'
          });
          
          console.log('Result:', result);
          " || true

  ai-comprehensive-tests:
    name: AI Integration Comprehensive Tests
    runs-on: ubuntu-latest
    needs: comprehensive-security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Test AI Private IP Support
        run: |
          cd backend
          npm run test -- --testPathPattern=ai-integration.test.js
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
      
      - name: Verify AI Security Configuration
        run: |
          cd backend
          node --experimental-vm-modules -e "
          import { SECURITY_CONFIG } from './utils/securityConfig.js';
          
          console.log('AI Security Configuration:');
          console.log('allowPrivateIPs:', SECURITY_CONFIG.urlValidation.allowPrivateIPs);
          console.log('allowLocalhost:', SECURITY_CONFIG.urlValidation.allowLocalhost);
          console.log('trustedDomains:', SECURITY_CONFIG.urlValidation.trustedDomains);
          
          if (!SECURITY_CONFIG.urlValidation.allowPrivateIPs) {
            console.error('❌ Private IPs should be allowed for AI services');
            process.exit(1);
          }
          
          console.log('✅ AI security configuration correct');
          "

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [full-integration-suite, email-and-messaging-tests, ai-comprehensive-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Install Playwright
        run: |
          npx playwright install --with-deps
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
      
      - name: Start Application
        run: |
          npm run dev &
          sleep 30
        env:
          NODE_ENV: test
      
      - name: Run E2E Tests
        run: |
          cd backend
          npm run test:e2e || true
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
      
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    needs: full-integration-suite
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Start Server
        run: |
          cd backend
          npm start &
          sleep 10
        env:
          NODE_ENV: test
      
      - name: Run Load Tests
        run: |
          npx autocannon -c 10 -d 30 http://localhost:3020/health || true
      
      - name: Test Response Times
        run: |
          curl -w "@-" -o /dev/null -s http://localhost:3020/health <<'EOF'
          time_namelookup:  %{time_namelookup}s\n
          time_connect:  %{time_connect}s\n
          time_appconnect:  %{time_appconnect}s\n
          time_pretransfer:  %{time_pretransfer}s\n
          time_redirect:  %{time_redirect}s\n
          time_starttransfer:  %{time_starttransfer}s\n
          ----------\n
          time_total:  %{time_total}s\n
          EOF

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [security-audit, comprehensive-security-tests, full-integration-suite, 
            email-and-messaging-tests, ai-comprehensive-tests, e2e-tests, performance-tests]
    if: always()
    
    steps:
      - name: Check Quality Gate
        run: |
          echo "Quality_Test Branch Quality Gate"
          echo "================================="
          echo ""
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Security Tests: ${{ needs.comprehensive-security-tests.result }}"
          echo "Integration Tests: ${{ needs.full-integration-suite.result }}"
          echo "Email Tests: ${{ needs.email-and-messaging-tests.result }}"
          echo "AI Tests: ${{ needs.ai-comprehensive-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo ""
          
          if [ "${{ needs.comprehensive-security-tests.result }}" != "success" ] || \
             [ "${{ needs.full-integration-suite.result }}" != "success" ] || \
             [ "${{ needs.email-and-messaging-tests.result }}" != "success" ] || \
             [ "${{ needs.ai-comprehensive-tests.result }}" != "success" ]; then
            echo "❌ Quality gate FAILED - Critical tests failed!"
            exit 1
          fi
          
          echo "✅ Quality gate PASSED - Ready for Pre_Prod!"
      
      - name: Create Quality Report
        if: success()
        run: |
          echo "Quality Test Summary - $(date)" > quality-report.md
          echo "======================================" >> quality-report.md
          echo "" >> quality-report.md
          echo "## Test Results" >> quality-report.md
          echo "- ✅ Security Audit: Passed" >> quality-report.md
          echo "- ✅ Security Tests: Passed" >> quality-report.md
          echo "- ✅ Integration Tests: Passed" >> quality-report.md
          echo "- ✅ Email Tests: Passed" >> quality-report.md
          echo "- ✅ AI Tests: Passed" >> quality-report.md
          echo "- ✅ E2E Tests: Passed" >> quality-report.md
          echo "- ✅ Performance Tests: Passed" >> quality-report.md
          echo "" >> quality-report.md
          echo "## Verdict" >> quality-report.md
          echo "✅ **READY FOR PRE_PROD**" >> quality-report.md
      
      - name: Upload Quality Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: quality-report.md
