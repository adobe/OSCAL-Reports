# Weekly AMI drift check: deployed Image Factory EMR AMI vs newest candidate (≤7-day SLA).
# Runs on adobe/OSCAL-Reports schedule; assumes an AWS role via GitHub OIDC (see
# terraform/envs/aws4403/github_actions_oidc.tf) — set the `AWS4403_AMI_DRIFT_ROLE_ARN`
# repo variable (Settings > Secrets and variables > Actions > Variables) to that
# role's ARN after `terraform apply`.
name: AMI Drift Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for aws-actions/configure-aws-credentials OIDC role assumption

jobs:
  ami-drift:
    name: Check OSCAL EMR AMI age
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS4403_AMI_DRIFT_ROLE_ARN }}
          role-session-name: ami-drift-check
          aws-region: us-east-1

      - name: Terraform init (aws4403)
        working-directory: terraform/envs/aws4403
        run: terraform init -input=false

      - name: Run AMI drift check
        working-directory: terraform/envs/aws4403
        env:
          TERRAFORM_DIR: ${{ github.workspace }}/terraform/envs/aws4403
          MAX_AMI_AGE_DAYS: "7"
          INSTANCE_ARCHITECTURE: x86_64
        run: |
          bash "${{ github.workspace }}/scripts/check-ami-drift.sh"
