name: Branch Protection Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-branch-flow:
    name: Validate Branch Flow
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Check branch protection rules
        id: check
        run: |
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"
          
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          
          # Initialize validation result
          VALID="true"
          MESSAGE=""
          
          # Rule 1: Only Pre_Prod can merge to main
          if [[ "$BASE" == "main" ]]; then
            if [[ "$HEAD" != "Pre_Prod" ]]; then
              VALID="false"
              MESSAGE="❌ ERROR: Only 'Pre_Prod' branch can merge to 'main'.\n\nCurrent PR: $HEAD → main\n\n"
              MESSAGE+="Required flow:\n"
              MESSAGE+="  Development/Quality_Test → Pre_Prod → main\n\n"
              MESSAGE+="Please close this PR and create a PR to 'Pre_Prod' instead."
            else
              MESSAGE="✅ Valid: Pre_Prod → main (Production Release)"
            fi
          fi
          
          # Rule 2: Recommended flow for Pre_Prod (INFO only - allows flexibility)
          if [[ "$BASE" == "Pre_Prod" ]]; then
            if [[ "$HEAD" == "Development" || "$HEAD" == "Quality_Test" ]]; then
              MESSAGE="✅ Valid: $HEAD → Pre_Prod (Staging) - Recommended flow"
            elif [[ "$HEAD" =~ ^(feature|fix|hotfix|test)/ ]]; then
              MESSAGE="ℹ️ INFO: Feature/fix branch merging to Pre_Prod.\n\n"
              MESSAGE+="Current PR: $HEAD → Pre_Prod\n\n"
              MESSAGE+="💡 Recommended flow:\n"
              MESSAGE+="  Development/Quality_Test → Pre_Prod → main\n\n"
              MESSAGE+="⚠️ You may proceed, but consider merging to Development/Quality_Test first for better workflow tracking."
            else
              MESSAGE="ℹ️ INFO: Cross-branch merge to Pre_Prod.\n\n"
              MESSAGE+="Current PR: $HEAD → Pre_Prod\n\n"
              MESSAGE+="Ensure this change has been properly tested."
            fi
          fi
          
          # Rule 3: Cross-branch merging guidance (INFO only - no blocking)
          if [[ "$BASE" == "Development" && "$HEAD" == "Quality_Test" ]]; then
            MESSAGE="ℹ️ INFO: Quality_Test → Development merge.\n\n"
            MESSAGE+="💡 Typical flow: Both Development and Quality_Test merge to Pre_Prod.\n\n"
            MESSAGE+="You may proceed if this cross-merge is intentional."
          fi
          
          if [[ "$BASE" == "Quality_Test" && "$HEAD" == "Development" ]]; then
            MESSAGE="ℹ️ INFO: Development → Quality_Test merge.\n\n"
            MESSAGE+="💡 Typical flow: Both Development and Quality_Test merge to Pre_Prod.\n\n"
            MESSAGE+="You may proceed if this cross-merge is intentional."
          fi
          
          # Rule 4: Feature/fix branches should target Development or Quality_Test
          if [[ "$HEAD" =~ ^(feature|fix)/ && "$BASE" != "Development" && "$BASE" != "Pre_Prod" ]]; then
            MESSAGE="ℹ️ INFO: Feature/fix branches typically target 'Development' branch.\n\n"
            MESSAGE+="Current target: $BASE\n"
            MESSAGE+="Consider: Development"
          fi
          
          if [[ "$HEAD" =~ ^test/ && "$BASE" != "Quality_Test" && "$BASE" != "Pre_Prod" ]]; then
            MESSAGE="ℹ️ INFO: Test branches typically target 'Quality_Test' branch.\n\n"
            MESSAGE+="Current target: $BASE\n"
            MESSAGE+="Consider: Quality_Test"
          fi
          
          # Output results
          echo "valid=$VALID" >> $GITHUB_OUTPUT
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Print to console
          echo "================================"
          echo "Branch Flow Validation"
          echo "================================"
          echo -e "$MESSAGE"
          echo "================================"
          
          # Fail if validation fails
          if [[ "$VALID" == "false" ]]; then
            exit 1
          fi
      
      - name: 📝 Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `${{ steps.check.outputs.message }}`;
            const valid = '${{ steps.check.outputs.valid }}';
            
            let body = '## 🌳 Branch Protection Check\n\n';
            body += message + '\n\n';
            body += '---\n\n';
            body += '### 📋 Branching Strategy\n\n';
            body += 'Our branching flow:\n';
            body += '```\n';
            body += 'Development  ─────┐\n';
            body += '                  ├──> Pre_Prod ─────> main (Production)\n';
            body += 'Quality_Test ─────┘\n';
            body += '```\n\n';
            body += '**Rules:**\n';
            body += '- ✅ Development/Quality_Test → Pre_Prod\n';
            body += '- ✅ Pre_Prod → main\n';
            body += '- ❌ Development/Quality_Test → main (direct merge blocked)\n';
            body += '- ❌ Development ↔ Quality_Test (parallel branches)\n\n';
            body += '**Documentation**: See `docs/BRANCHING_STRATEGY.md`\n\n';
            if (valid === 'false') {
              body += '⚠️ **This PR violates branch protection rules. Please update the target branch.**\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: ✅ Validation Complete
        if: success()
        run: |
          echo "✅ Branch flow validation passed!"
          echo "This PR follows the branching strategy."
      
      - name: ❌ Validation Failed
        if: failure()
        run: |
          echo "❌ Branch flow validation failed!"
          echo "Please review the branching strategy in docs/BRANCHING_STRATEGY.md"
          exit 1

  deployment-check:
    name: Check Deployment Stage
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Identify deployment stage
        run: |
          BASE="${{ github.base_ref }}"
          
          case "$BASE" in
            "main")
              echo "🏭 Deployment: PRODUCTION"
              echo "⚠️  High impact - review carefully!"
              ;;
            "Pre_Prod")
              echo "🧪 Deployment: STAGING (Pre-Production)"
              echo "ℹ️  Will deploy to staging environment"
              ;;
            "Development")
              echo "🔧 Deployment: DEVELOPMENT"
              echo "ℹ️  Development testing only"
              ;;
            "Quality_Test")
              echo "✅ Deployment: QA TESTING"
              echo "ℹ️  QA validation environment"
              ;;
            *)
              echo "ℹ️  Deployment: None (feature branch)"
              ;;
          esac
