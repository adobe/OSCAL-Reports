name: Validate Deployment Configurations

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ###############################################################################
  # Validate Workflow Files
  ###############################################################################
  validate-workflows:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ✅ Validate workflow files
        run: |
          echo "🔍 Validating workflow files..."
          
          # Check for syntax errors in all workflow files
          for workflow in .github/workflows/*.yml; do
            echo "Checking: $workflow"
            # Basic YAML validation
            if ! python3 -c "import yaml; yaml.safe_load(open('$workflow'))" 2>/dev/null; then
              echo "❌ YAML syntax error in $workflow"
              exit 1
            fi
            echo "✅ Valid: $workflow"
          done
          
          echo ""
          echo "✅ All workflow files are valid!"

  ###############################################################################
  # Validate Docker Configuration
  ###############################################################################
  validate-docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: ✅ Validate Dockerfile
        run: |
          echo "🔍 Validating Dockerfile..."
          
          # Check if Dockerfile exists
          if [ ! -f "Dockerfile" ]; then
            echo "❌ Dockerfile not found!"
            exit 1
          fi
          
          # Lint Dockerfile (if hadolint is available)
          if command -v hadolint &> /dev/null; then
            hadolint Dockerfile || echo "⚠️  Dockerfile has lint warnings (non-critical)"
          fi
          
          echo "✅ Dockerfile validated"
      
      - name: 🏗️ Test Docker Build (dry-run)
        run: |
          echo "🏗️ Testing Docker build (without pushing)..."
          
          docker build \
            --target production \
            --build-arg BUILD_TIMESTAMP="$(date -Iseconds)" \
            --build-arg PORT=3020 \
            -t oscal-test:latest .
          
          echo ""
          echo "✅ Docker build successful!"
          
          # Show image size
          docker images oscal-test:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  ###############################################################################
  # Validate AWS Configuration (No actual deployment)
  ###############################################################################
  validate-aws-config:
    name: Validate AWS Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ✅ Validate AWS Task Definition
        run: |
          echo "🔍 Validating AWS ECS task definition..."
          
          if [ -f ".aws/task-definition.json" ]; then
            # Validate JSON syntax
            if ! jq empty .aws/task-definition.json 2>/dev/null; then
              echo "❌ Invalid JSON in task-definition.json"
              exit 1
            fi
            
            # Check required fields
            if ! jq -e '.family' .aws/task-definition.json > /dev/null; then
              echo "❌ Missing 'family' field in task definition"
              exit 1
            fi
            
            echo "✅ AWS task definition is valid"
          else
            echo "⚠️  No AWS task definition found (create .aws/task-definition.json if using AWS)"
          fi
      
      - name: ✅ Check AWS Workflow Requirements
        run: |
          echo "📋 AWS deployment requirements:"
          echo ""
          echo "Required GitHub Secrets:"
          echo "  - AWS_ACCESS_KEY_ID"
          echo "  - AWS_SECRET_ACCESS_KEY"
          echo "  - AWS_REGION"
          echo "  - ECS_CLUSTER_NAME"
          echo "  - ECS_SERVICE_NAME"
          echo ""
          echo "✅ AWS workflow configuration validated"

  ###############################################################################
  # Validate Azure Configuration (No actual deployment)
  ###############################################################################
  validate-azure-config:
    name: Validate Azure Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ✅ Check Azure Workflow Requirements
        run: |
          echo "📋 Azure deployment requirements:"
          echo ""
          echo "Required GitHub Secrets:"
          echo "  - AZURE_CREDENTIALS"
          echo "  - AZURE_WEBAPP_NAME"
          echo ""
          echo "✅ Azure workflow configuration validated"

  ###############################################################################
  # Validate Kubernetes Configuration (if exists)
  ###############################################################################
  validate-k8s-config:
    name: Validate Kubernetes Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: ✅ Validate Kubernetes manifests
        run: |
          echo "🔍 Validating Kubernetes manifests..."
          
          if [ -d "k8s" ]; then
            # Dry-run validation of all K8s manifests
            for manifest in k8s/*.yaml k8s/*.yml; do
              if [ -f "$manifest" ]; then
                echo "Validating: $manifest"
                kubectl apply --dry-run=client -f "$manifest" || {
                  echo "❌ Invalid manifest: $manifest"
                  exit 1
                }
              fi
            done
            echo "✅ All Kubernetes manifests are valid"
          else
            echo "⚠️  No Kubernetes manifests found (create k8s/ directory if using K8s)"
          fi

  ###############################################################################
  # Summary Report
  ###############################################################################
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-workflows, validate-docker, validate-aws-config, validate-azure-config, validate-k8s-config]
    if: always()
    
    steps:
      - name: 📊 Generate Validation Report
        run: |
          cat > validation-summary.md << 'EOF'
          # 🔍 Deployment Configuration Validation Report
          
          ## ✅ Validation Results
          
          | Component | Status |
          |-----------|--------|
          | Workflow Files | ${{ needs.validate-workflows.result == 'success' && '✅ Valid' || '❌ Failed' }} |
          | Docker Build | ${{ needs.validate-docker.result == 'success' && '✅ Valid' || '❌ Failed' }} |
          | AWS Config | ${{ needs.validate-aws-config.result == 'success' && '✅ Valid' || '❌ Failed' }} |
          | Azure Config | ${{ needs.validate-azure-config.result == 'success' && '✅ Valid' || '❌ Failed' }} |
          | K8s Config | ${{ needs.validate-k8s-config.result == 'success' && '✅ Valid' || needs.validate-k8s-config.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
          
          ## 📋 What This Validates
          
          This workflow validates your deployment configurations **without** actually provisioning cloud resources:
          
          - ✅ Workflow syntax and structure
          - ✅ Docker build configuration
          - ✅ AWS/Azure configuration files
          - ✅ Kubernetes manifests (if present)
          - ✅ Required secrets documentation
          
          ## 🚀 Actual Deployment
          
          To deploy to cloud platforms, use manual workflows:
          
          ```bash
          # Trigger manual deployment (requires cloud credentials configured)
          gh workflow run deploy-aws.yml
          gh workflow run deploy-azure.yml
          ```
          
          Or go to **Actions** → Select workflow → **Run workflow**
          
          ## ⚠️ Note
          
          This validation workflow runs automatically on every push and does NOT:
          - ❌ Provision actual cloud resources
          - ❌ Require cloud credentials
          - ❌ Deploy applications
          
          It only validates that your configurations are correct!
          
          ---
          
          **Validation completed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          
          cat validation-summary.md >> $GITHUB_STEP_SUMMARY
          cat validation-summary.md
      
      - name: 📤 Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-summary.md
          retention-days: 30
