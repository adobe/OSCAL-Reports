name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  ###############################################################################
  # Create GitHub Release
  ###############################################################################
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📝 Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: 📝 Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          # Extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install dependencies and build
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && npm run build && cd ..
      
      - name: 📦 Create release archives
        run: |
          # Create backend archive
          tar -czf oscal-backend-${{ steps.version.outputs.version }}.tar.gz \
            backend/*.js \
            backend/auth \
            backend/utils \
            backend/package.json \
            backend/package-lock.json \
            --exclude=backend/node_modules \
            --exclude=backend/tests
          
          # Create frontend archive
          tar -czf oscal-frontend-${{ steps.version.outputs.version }}.tar.gz \
            frontend/dist
          
          # Create full release archive
          tar -czf oscal-report-generator-${{ steps.version.outputs.version }}.tar.gz \
            backend/*.js \
            backend/auth \
            backend/utils \
            backend/package.json \
            backend/package-lock.json \
            frontend/dist \
            docs \
            *.md \
            *.sh \
            --exclude=backend/node_modules \
            --exclude=backend/tests \
            --exclude=frontend/node_modules \
            --exclude=frontend/tests
      
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            oscal-backend-${{ steps.version.outputs.version }}.tar.gz
            oscal-frontend-${{ steps.version.outputs.version }}.tar.gz
            oscal-report-generator-${{ steps.version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📢 Release notification
        run: |
          echo "🎉 Release v${{ steps.version.outputs.version }} created successfully!"
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"

