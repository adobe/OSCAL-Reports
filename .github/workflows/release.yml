# GitHub Release + artifacts for Adobe org repo only (avoids duplicate releases on personal fork).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  ###############################################################################
  # Create GitHub Release
  ###############################################################################
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.repository == 'AdobeManagedServices/OSCAL-Reports'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: 📝 Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
      
      - name: 📝 Write release notes file for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          if [ -f docs/CHANGELOG.md ]; then
            sed -n "/## \\[${VERSION}\\]/,/## \\[/p" docs/CHANGELOG.md | sed '$d' > "$NOTES"
          elif [ -f CHANGELOG.md ]; then
            sed -n "/## \\[${VERSION}\\]/,/## \\[/p" CHANGELOG.md | sed '$d' > "$NOTES"
          else
            echo "Release ${VERSION}" > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            echo "Release ${VERSION}" > "$NOTES"
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      
      - name: 📦 Install dependencies and build
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && npm run build && cd ..
      
      - name: 📦 Create release archives
        run: |
          # Create backend archive
          tar --exclude=backend/node_modules \
              --exclude=backend/test_cases \
              -czf oscal-backend-${{ steps.version.outputs.version }}.tar.gz \
              -- \
              backend/*.js \
              backend/auth \
              backend/utils \
              backend/package.json \
              backend/package-lock.json
          
          # Create frontend archive
          tar -czf oscal-frontend-${{ steps.version.outputs.version }}.tar.gz \
            -- \
            frontend/dist
          
          # Create full release archive (include root .md and .sh only if they exist).
          # Use -print0 + array so paths are not word-split or mis-parsed as tar options.
          extras=()
          while IFS= read -r -d '' f; do
            extras+=("${f#./}")
          done < <(find . -maxdepth 1 \( -name '*.md' -o -name '*.sh' \) -print0 2>/dev/null || true)
          tar --exclude=backend/node_modules \
              --exclude=backend/test_cases \
              --exclude=frontend/node_modules \
              --exclude=frontend/test_cases \
              -czf oscal-report-generator-${{ steps.version.outputs.version }}.tar.gz \
              -- \
              backend/*.js \
              backend/auth \
              backend/utils \
              backend/package.json \
              backend/package-lock.json \
              frontend/dist \
              docs \
              "${extras[@]}"
      
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: false
          files: |
            oscal-backend-${{ steps.version.outputs.version }}.tar.gz
            oscal-frontend-${{ steps.version.outputs.version }}.tar.gz
            oscal-report-generator-${{ steps.version.outputs.version }}.tar.gz
      
      - name: 📢 Release notification
        run: |
          echo "🎉 Release v${{ steps.version.outputs.version }} created successfully!"
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"

