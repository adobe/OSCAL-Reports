name: Development Branch Tests

on:
  push:
    branches:
      - Development
  pull_request:
    branches:
      - Development

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Run ESLint (Backend)
        run: |
          cd backend
          npx eslint . --ext .js || true
      
      - name: Run ESLint (Frontend)
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run Unit Tests
        run: |
          cd backend
          npm run test:unit
        env:
          NODE_ENV: test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run Integration Tests
        run: |
          cd backend
          npm run test:integration
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
          TEST_USER_PASSWORD: User@2026
          TEST_ASSESSOR_PASSWORD: Assessor@2026

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
