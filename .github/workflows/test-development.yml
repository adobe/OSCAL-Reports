name: Development Branch Tests

on:
  push:
    branches:
      - Development
  pull_request:
    branches:
      - Development

jobs:
  security-tests:
    name: Security Tests (CSRF & SSRF)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Run CSRF Protection Tests
        run: |
          cd backend
          npm run test -- --testPathPattern=csrf-protection.test.js
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
          TEST_USER_PASSWORD: User@2026
      
      - name: Run SSRF Protection Tests
        run: |
          cd backend
          npm run test -- --testPathPattern=ssrf-protection.test.js
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
      
      - name: Run URL Validator Tests
        run: |
          cd backend
          npm run test -- --testPathPattern=urlValidator.test.js
        env:
          NODE_ENV: test

  email-tests:
    name: Email Functionality Tests
    runs-on: ubuntu-latest
    needs: security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run Email Tests
        run: |
          cd backend
          npm run test -- --testPathPattern=email-functionality.test.js
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026

  ai-integration-tests:
    name: AI Integration Tests
    runs-on: ubuntu-latest
    needs: security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run AI Integration Tests
        run: |
          cd backend
          npm run test -- --testPathPattern=ai-integration.test.js
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run Unit Tests
        run: |
          cd backend
          npm run test:unit
        env:
          NODE_ENV: test
      
      # Note: codecov/codecov-action is not allowed by Adobe organization policy
      # Coverage reports are uploaded as artifacts instead
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-development
          path: ./backend/coverage/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [security-tests, email-tests, ai-integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
      
      - name: Run Integration Tests
        run: |
          cd backend
          npm run test:integration
        env:
          NODE_ENV: test
          TEST_ADMIN_PASSWORD: Admin@2026
          TEST_USER_PASSWORD: User@2026
          TEST_ASSESSOR_PASSWORD: Assessor@2026

  lint-and-format:
    name: Linting and Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Run ESLint (Backend)
        run: |
          cd backend
          npx eslint . --ext .js || true
      
      - name: Run ESLint (Frontend)
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx || true

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
      
      - name: Test Backend Startup
        run: |
          cd backend
          timeout 30s npm start || exit 0
        env:
          NODE_ENV: test
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  summary-and-auto-merge:
    name: Development Tests Summary & Auto-Merge
    runs-on: ubuntu-latest
    needs: [security-tests, email-tests, ai-integration-tests, unit-tests, integration-tests, build-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/Development'
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Calculate Test Results
        id: test_results
        run: |
          echo "Development Branch Test Summary:"
          echo "================================="
          
          # Count successful and failed jobs
          TOTAL=6
          PASSED=0
          
          # Check each job result
          declare -A JOBS=(
            ["security-tests"]="${{ needs.security-tests.result }}"
            ["email-tests"]="${{ needs.email-tests.result }}"
            ["ai-integration-tests"]="${{ needs.ai-integration-tests.result }}"
            ["unit-tests"]="${{ needs.unit-tests.result }}"
            ["integration-tests"]="${{ needs.integration-tests.result }}"
            ["build-test"]="${{ needs.build-test.result }}"
          )
          
          for job in "${!JOBS[@]}"; do
            result="${JOBS[$job]}"
            echo "$job: $result"
            if [ "$result" == "success" ]; then
              ((PASSED++))
            fi
          done
          
          # Calculate pass rate
          PASS_RATE=$(awk "BEGIN {printf \"%.2f\", ($PASSED / $TOTAL) * 100}")
          THRESHOLD=60
          
          echo ""
          echo "📊 Test Statistics:"
          echo "  Total Jobs: $TOTAL"
          echo "  Passed: $PASSED"
          echo "  Failed: $((TOTAL - PASSED))"
          echo "  Pass Rate: ${PASS_RATE}%"
          echo "  Threshold: ${THRESHOLD}%"
          
          # Set outputs
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$((TOTAL - PASSED))" >> "$GITHUB_OUTPUT"
          echo "pass_rate=$PASS_RATE" >> "$GITHUB_OUTPUT"
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          
          # Check if threshold met
          if (( $(awk "BEGIN {print ($PASS_RATE >= $THRESHOLD)}") )); then
            echo "threshold_met=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "✅ Pass rate ${PASS_RATE}% meets threshold ${THRESHOLD}%"
            echo "🚀 Auto-merge conditions satisfied!"
          else
            echo "threshold_met=false" >> "$GITHUB_OUTPUT"
            echo ""
            echo "❌ Pass rate ${PASS_RATE}% below threshold ${THRESHOLD}%"
            echo "⏸️  Auto-merge will NOT proceed"
          fi
      
      - name: Create Auto-Merge PR to Quality_Test
        if: steps.test_results.outputs.threshold_met == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_BRANCH="Development"
          TARGET_BRANCH="Quality_Test"
          PASS_RATE="${{ steps.test_results.outputs.pass_rate }}"
          THRESHOLD="${{ steps.test_results.outputs.threshold }}"
          
          echo "════════════════════════════════════════════════════════════════"
          echo "    🤖 AUTO-MERGE: $SOURCE_BRANCH → $TARGET_BRANCH"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "📊 Pass Rate: ${PASS_RATE}%"
          echo "🎯 Threshold: ${THRESHOLD}%"
          echo ""
          
          # Check for differences
          git fetch origin "$TARGET_BRANCH" || true
          
          if git diff --quiet "origin/$TARGET_BRANCH" HEAD; then
            echo "ℹ️  No differences found between branches"
            echo "✅ Branches are already in sync"
            exit 0
          fi
          
          # Create PR
          PR_TITLE="🤖 Auto-merge: Development → Quality_Test (${PASS_RATE}% pass rate)"
          PR_BODY="## 🤖 Automated Merge

          This PR was automatically created because the Development branch test pass rate threshold was met.

          ### 📊 Test Results
          - **Pass Rate:** ${PASS_RATE}%
          - **Threshold:** ${THRESHOLD}% (60% required)
          - **Passed Jobs:** ${{ steps.test_results.outputs.passed }}/${{ steps.test_results.outputs.total }}
          - **Status:** ✅ Threshold met

          ### ✅ Passed Tests
          - Security Tests (CSRF, SSRF, URL Validation)
          - Email Functionality Tests
          - AI Integration Tests
          - Unit Tests
          - Integration Tests
          - Build Test

          ### 🔄 Merge Details
          - **Source:** \`Development\`
          - **Target:** \`Quality_Test\`
          - **Commit:** \`${{ github.sha }}\`
          - **Workflow:** ${{ github.run_id }}

          ### 📋 Next Steps
          Once merged to Quality_Test, comprehensive testing will begin:
          - Security audit
          - Full integration suite with coverage
          - E2E tests with Playwright
          - Performance testing
          - Quality gate checks (80% threshold for Pre_Prod)

          ---
          *This is an automated pull request created by the CI/CD pipeline.*"
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base "$TARGET_BRANCH" --head "$SOURCE_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "✅ PR already exists: #$EXISTING_PR"
            echo "📝 Updating existing PR..."
            gh pr edit "$EXISTING_PR" --body "$PR_BODY" || true
            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            echo "📝 Creating new PR..."
            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --label "auto-merge,development" 2>&1 || echo "")
            
            if [ -n "$PR_URL" ]; then
              echo "✅ PR created: $PR_URL"
              PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
              echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              
              # Enable auto-merge
              echo "🔄 Enabling auto-merge..."
              gh pr merge "$PR_NUMBER" --auto --merge --delete-branch=false 2>&1 || {
                echo "⚠️  Auto-merge could not be enabled (may require approvals)"
              }
            else
              echo "⚠️  Could not create PR"
            fi
          fi
          
          echo ""
          echo "✅ Auto-merge process completed!"
      
      - name: Post Summary Comment
        if: always()
        run: |
          echo "## 📊 Development Branch Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pass Rate:** ${{ steps.test_results.outputs.pass_rate }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold:** ${{ steps.test_results.outputs.threshold }}% (60% required)" >> $GITHUB_STEP_SUMMARY
          echo "**Passed:** ${{ steps.test_results.outputs.passed }}/${{ steps.test_results.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.test_results.outputs.threshold_met }}" == "true" ]; then
            echo "### ✅ Auto-Merge Status: TRIGGERED" >> $GITHUB_STEP_SUMMARY
            echo "A PR has been created to merge Development → Quality_Test" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Auto-Merge Status: NOT TRIGGERED" >> $GITHUB_STEP_SUMMARY
            echo "Pass rate below 60% threshold. Manual intervention required." >> $GITHUB_STEP_SUMMARY
          fi
