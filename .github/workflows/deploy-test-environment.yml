name: Deploy Testing Environment

# IMPORTANT: This workflow only runs on AdobeManagedServices/OSCAL-Reports
# The personal repository (keekar2022/OSCAL-Reports) does not have:
# - GitLab runner access
# - NGROK_AUTHTOKEN secret
# Therefore, ngrok-related deployments are restricted to the Adobe repository

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'How long to keep environment running (hours)'
        required: false
        type: number
        default: 5
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ###############################################################################
  # Run Tests
  ###############################################################################
  tests:
    name: Run All Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      
      - name: 🧪 Run backend tests
        working-directory: ./backend
        run: |
          npm run test:unit
          npm run test:integration
      
      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build

  ###############################################################################
  # GitHub Runner + Ngrok (5 Hour Testing Environment)
  ###############################################################################
  # Note: Railway deployment removed - action not allowed by organization
  # Note: Only runs on Adobe repository where GitLab runner and ngrok secrets are available
  ###############################################################################
  deploy-runner-test:
    name: Deploy on Runner with Ngrok (5 Hours)
    runs-on: ubuntu-latest
    needs: [tests]
    if: |
      github.repository == 'AdobeManagedServices/OSCAL-Reports' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Build Docker Image
        run: |
          docker build -t oscal-test:latest \
            --build-arg BUILD_TIMESTAMP="$(date -Iseconds)" \
            --build-arg PORT=3020 .
      
      - name: 🚀 Start Application
        run: |
          docker run -d \
            --name oscal-test \
            -p 3020:3020 \
            oscal-test:latest
          
          # Wait for app to start
          echo "Waiting for application to start..."
          sleep 10
          
          # Check health
          curl http://localhost:3020/health
      
      - name: 🌐 Install Ngrok
        run: |
          # Download and install ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # Configure ngrok with auth token
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          
          echo "✅ Ngrok installed and configured"
      
      - name: 🚀 Start Ngrok Tunnel
        run: |
          # Start ngrok in background
          nohup ngrok http 3020 --log=stdout > ngrok.log 2>&1 &
          
          # Wait for ngrok to start
          echo "Waiting for ngrok to start..."
          sleep 10
          
          # Verify ngrok is running
          if ! pgrep -x "ngrok" > /dev/null; then
            echo "❌ Ngrok failed to start"
            cat ngrok.log
            exit 1
          fi
          
          echo "✅ Ngrok tunnel started"
      
      - name: 📝 Get Ngrok URL
        id: ngrok-url
        run: |
          # Wait a bit more to ensure API is ready
          sleep 5
          
          # Get ngrok URL from API
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          
          if [ -z "$NGROK_URL" ] || [ "$NGROK_URL" == "null" ]; then
            echo "❌ Failed to get ngrok URL"
            echo "Ngrok API response:"
            curl -s http://localhost:4040/api/tunnels | jq .
            echo "Ngrok logs:"
            cat ngrok.log
            exit 1
          fi
          
          echo "url=$NGROK_URL" >> $GITHUB_OUTPUT
          echo "🌐 Testing URL: $NGROK_URL"
      
      - name: 📧 Notify Testers
        run: |
          cat > testing-notification.md << EOF
          # 🧪 Testing Environment Active!
          
          ## 🌐 Testing URL (Active for 5 hours)
          **URL**: ${{ steps.ngrok-url.outputs.url }}
          
          ## ⏰ Availability
          - **Started**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Active Until**: $(date -u -d '+5 hours' '+%Y-%m-%d %H:%M:%S UTC')
          - **Duration**: 5 hours
          
          ## 👥 For Testers
          
          This temporary testing environment is now available at:
          **${{ steps.ngrok-url.outputs.url }}**
          
          ### Quick Access:
          - Application: ${{ steps.ngrok-url.outputs.url }}
          - Health Check: ${{ steps.ngrok-url.outputs.url }}/health
          
          ### Default Credentials
          Check workflow artifacts for default credentials.
          
          ### Testing Guidelines
          1. Test all major functionality
          2. Document any issues found
          3. Complete testing within 5 hours
          4. Report findings before environment shuts down
          
          ---
          
          ⚠️ **Important**: This is a temporary environment and will shut down automatically after 5 hours.
          
          EOF
          
          cat testing-notification.md >> $GITHUB_STEP_SUMMARY
      
      - name: ⏰ Keep Environment Running
        run: |
          # Use input duration or default to 5 hours
          DURATION_HOURS=${{ inputs.duration_hours || 5 }}
          DURATION_SECONDS=$((DURATION_HOURS * 3600))
          
          echo "🕐 Testing environment will remain active for $DURATION_HOURS hours..."
          echo "Testers can access at: ${{ steps.ngrok-url.outputs.url }}"
          echo ""
          echo "Monitoring application health..."
          
          # Calculate end time
          END_TIME=$(($(date +%s) + DURATION_SECONDS))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            # Check if app is still running
            if docker ps | grep -q oscal-test; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3020/health)
              if [ "$STATUS" -eq "200" ]; then
                echo "✅ [$(date '+%Y-%m-%d %H:%M:%S')] Application healthy"
              else
                echo "⚠️  [$(date '+%Y-%m-%d %H:%M:%S')] Application may have issues (HTTP $STATUS)"
              fi
            else
              echo "❌ [$(date '+%Y-%m-%d %H:%M:%S')] Container stopped unexpectedly"
              break
            fi
            
            # Check every 5 minutes
            sleep 300
          done
          
          echo ""
          echo "⏰ $DURATION_HOURS hours elapsed. Shutting down testing environment..."
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "Stopping and removing container..."
          docker stop oscal-test || true
          docker rm oscal-test || true
          echo "✅ Cleanup complete"

  ###############################################################################
  # Notify Testers
  ###############################################################################
  notify-testers:
    name: Notify Testers
    runs-on: ubuntu-latest
    needs: [deploy-runner-test]
    if: success() && github.repository == 'AdobeManagedServices/OSCAL-Reports'
    
    steps:
      - name: 📧 Create Tester Notification
        run: |
          cat > tester-notification.md << EOF
          # 📢 New Build Ready for Testing!
          
          ## 🌐 Testing Environment (Active for 5 Hours)
          
          A new version has been deployed to the testing environment and is ready for functional testing.
          
          ### Access Information:
          - **URL**: Check the [workflow output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the Ngrok URL
          - **Environment**: Testing (GitHub Runner + Ngrok)
          - **Build**: #${{ github.run_number }}
          - **Commit**: ${{ github.sha }}
          - **Active Until**: 5 hours from deployment
          
          ### What's New:
          See the [commit diff](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) for changes in this build.
          
          ### Testing Instructions:
          1. Get the testing URL from the workflow output (Ngrok tunnel URL)
          2. Access the environment immediately (it will shut down after 5 hours)
          3. Perform functional testing on key features
          4. Document any anomalies or issues
          5. Report findings via GitHub Issues
          
          ### ⚠️ Important:
          - This testing environment is temporary (5 hours)
          - Complete testing within the time window
          - The environment will shut down automatically
          - Production deployment to TrueNAS is done manually
          
          ### Need Help?
          - View [Testing Summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Check workflow artifacts for credentials
          
          EOF
          
          cat tester-notification.md >> $GITHUB_STEP_SUMMARY
          
