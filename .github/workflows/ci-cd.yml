name: CI/CD Pipeline

on:
  push:
    branches: [ main, Pre_Prod, Development, Quality_Test ]
  pull_request:
    branches: [ main, Pre_Prod, Development, Quality_Test ]

jobs:
  ###############################################################################
  # Backend Tests
  ###############################################################################
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: 🧪 Run backend unit tests
        working-directory: ./backend
        run: npm run test:unit
      
      - name: 🧪 Run backend integration tests
        working-directory: ./backend
        run: npm run test:integration
      
      - name: 📊 Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage
      
      # Note: codecov/codecov-action is not allowed by organization policy
      # Coverage reports are generated locally and can be viewed in artifacts
      - name: 📤 Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./backend/coverage/
          retention-days: 7

  ###############################################################################
  # Frontend Tests
  ###############################################################################
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 7

  ###############################################################################
  # Code Quality & Security
  ###############################################################################
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install dependencies
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..
      
      - name: 🛡️ Run comprehensive validation
        run: |
          chmod +x test_cases/scripts/validate_best_practices.sh
          ./test_cases/scripts/validate_best_practices.sh
      
      - name: 🔄 Update best practices from npm audit
        run: |
          chmod +x test_cases/scripts/update_best_practices.sh
          ./test_cases/scripts/update_best_practices.sh
      
      - name: 🔒 Run npm audit (Backend)
        working-directory: ./backend
        run: |
          npm audit --audit-level=moderate || true
      
      - name: 🔒 Run npm audit (Frontend)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate || true

  ###############################################################################
  # Version Consistency Check
  ###############################################################################
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Check version synchronization
        run: |
          ROOT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          BACKEND_VERSION=$(grep '"version":' backend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          FRONTEND_VERSION=$(grep '"version":' frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          
          echo "Root version: $ROOT_VERSION"
          echo "Backend version: $BACKEND_VERSION"
          echo "Frontend version: $FRONTEND_VERSION"
          
          if [ "$ROOT_VERSION" != "$BACKEND_VERSION" ] || [ "$ROOT_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            exit 1
          else
            echo "✅ All versions synchronized: $ROOT_VERSION"
          fi

  ###############################################################################
  # Integration Test (Full Stack)
  ###############################################################################
  integration-test:
    name: Full Stack Integration
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install all dependencies
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..
      
      - name: 🚀 Start backend server
        working-directory: ./backend
        run: |
          npm start &
          echo $! > backend.pid
          sleep 10
      
      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: 🧪 Test health endpoint
        run: |
          curl -f http://localhost:3020/health || exit 1
      
      - name: 🛑 Stop backend server
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi

  ###############################################################################
  # Build and Push Docker Image
  ###############################################################################
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, code-quality, version-check, integration-test]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Development') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      image-tag: ${{ steps.extract-version.outputs.image-tag }}
      registry-url: ${{ steps.extract-version.outputs.registry-url }}
      dockerhub-tag: ${{ steps.docker-meta.outputs.tags }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📝 Extract version
        id: extract-version
        run: |
          VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image-tag=ghcr.io/${{ github.repository_owner }}/oscal-report-generator:$VERSION" >> $GITHUB_OUTPUT
          echo "registry-url=ghcr.io/${{ github.repository_owner }}/oscal-report-generator" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 🏷️ Docker metadata for tags
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/oscal-report-generator
            keekar/oscal_reports
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/Development' }}
            type=semver,pattern={{version}},value=${{ steps.extract-version.outputs.version }}
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.extract-version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
      
      - name: 📦 Build and push Docker image (Multi-registry)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
            PORT=3020
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📤 Extract credentials from image
        id: extract-credentials
        run: |
          # Wait for image to be available
          sleep 5
          
          # Create temporary container to extract credentials (use Docker Hub image)
          IMAGE_TAG="keekar/oscal_reports:${{ github.ref == 'refs/heads/main' && 'latest' || 'edge' }}"
          docker pull $IMAGE_TAG
          docker create --name temp-oscal $IMAGE_TAG
          docker cp temp-oscal:/app/credentials.txt credentials.txt || echo "No credentials file found"
          docker rm temp-oscal
          
          # Store credentials in output (masked)
          if [ -f credentials.txt ]; then
            ADMIN_PASS=$(grep "Password:" credentials.txt | head -1 | awk '{print $2}')
            echo "::add-mask::$ADMIN_PASS"
            echo "admin-password=$ADMIN_PASS" >> $GITHUB_OUTPUT
          fi
      
      - name: 📤 Upload credentials as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-credentials-${{ steps.extract-version.outputs.version }}
          path: credentials.txt
          retention-days: 7
  
  ###############################################################################
  # Deploy to Production
  ###############################################################################
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deployment Instructions
        id: deploy-info
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          REGISTRY_URL="${{ needs.build-and-push.outputs.registry-url }}"
          DOCKERHUB_TAG="${{ github.ref == 'refs/heads/main' && 'latest' || 'edge' }}"
          
          echo "deployment-url=http://nas.keekar.com:3020" >> $GITHUB_OUTPUT
          echo "image-url=$REGISTRY_URL:$VERSION" >> $GITHUB_OUTPUT
          
          echo "🎉 Docker image built and pushed successfully!"
          echo ""
          echo "📦 Image Details:"
          echo "  - Version: $VERSION"
          echo "  - GHCR Image: $IMAGE_TAG"
          echo "  - Docker Hub: keekar/oscal_reports:$DOCKERHUB_TAG"
          echo "  - Docker Hub Version: keekar/oscal_reports:$VERSION"
          echo ""
          echo "🚀 Deployment Options:"
          echo ""
          echo "1️⃣ Docker Hub (Public - Easiest for external users):"
          echo "   docker pull keekar/oscal_reports:$DOCKERHUB_TAG"
          echo "   docker run -d --name oscal-app -p 3020:3020 -v \$(pwd)/config:/app/config keekar/oscal_reports:$DOCKERHUB_TAG"
          echo ""
          echo "2️⃣ TrueNAS Deployment (Recommended for production):"
          echo "   SSH into TrueNAS and run:"
          echo "   cd /mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Green"
          echo "   git pull origin main"
          echo "   ./build_on_truenas.sh"
          echo ""
          echo "3️⃣ GitHub Container Registry (GHCR):"
          echo "   docker pull ${IMAGE_TAG}"
          echo "   docker run -d --name oscal-app -p 3020:3020 -v \$(pwd)/config:/app/config ${IMAGE_TAG}"
          echo ""
          echo "4️⃣ Docker Compose:"
          echo "   docker-compose pull"
          echo "   docker-compose up -d"
          echo ""
          echo "🌐 Access URLs:"
          echo "  - Blue Instance: http://nas.keekar.com:3020"
          echo "  - Green Instance: http://nas.keekar.com:3019"
          echo ""
          echo "🐳 Public Docker Hub:"
          echo "  - https://hub.docker.com/r/keekar/oscal_reports"
          echo ""
          echo "📋 Next Steps:"
          echo "  1. Pull from Docker Hub: docker pull keekar/oscal_reports:$DOCKERHUB_TAG"
          echo "  2. Deploy to TrueNAS using build_on_truenas.sh"
          echo "  3. Test deployment at http://nas.keekar.com:3020"
          echo "  4. Check credentials in workflow artifacts"
          echo "  5. Change default passwords immediately"
      
      # Optional: Trigger TrueNAS deployment via webhook or SSH
      # Uncomment and configure if you want automatic deployment
      # - name: 🔔 Trigger TrueNAS Deployment
      #   run: |
      #     # Option 1: Via webhook (if configured on TrueNAS)
      #     curl -X POST ${{ secrets.TRUENAS_WEBHOOK_URL }} \
      #       -H "Authorization: Bearer ${{ secrets.TRUENAS_WEBHOOK_TOKEN }}" \
      #       -d '{"version": "${{ needs.build-and-push.outputs.version }}"}'
      #     
      #     # Option 2: Via SSH (requires SSH key in secrets)
      #     # echo "${{ secrets.TRUENAS_SSH_KEY }}" > /tmp/ssh_key
      #     # chmod 600 /tmp/ssh_key
      #     # ssh -i /tmp/ssh_key mkesharw@NAS01 'cd /mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Green && git pull && ./build_on_truenas.sh'

  ###############################################################################
  # Comprehensive Notifications
  ###############################################################################
  notify-success:
    name: Notify Deployment Success
    runs-on: ubuntu-latest
    needs: [deploy, build-and-push]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📧 Create Deployment Summary
        id: summary
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          DOCKERHUB_TAG="${{ github.ref == 'refs/heads/main' && 'latest' || 'edge' }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          COMMIT_SHA=$(git log -1 --pretty=format:'%h')
          
          cat > deployment-summary.md << EOF
          # 🚀 Deployment Ready - OSCAL Report Generator v$VERSION
          
          ## 📦 Build Information
          - **Version**: $VERSION
          - **GHCR Image**: \`$IMAGE_TAG\`
          - **Docker Hub**: \`keekar/oscal_reports:$DOCKERHUB_TAG\`
          - **Commit**: $COMMIT_SHA - $COMMIT_MSG
          - **Author**: $COMMIT_AUTHOR
          - **Workflow**: [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ## 🐳 Docker Images Available
          - **Docker Hub (Public)**: https://hub.docker.com/r/keekar/oscal_reports
            - \`docker pull keekar/oscal_reports:$DOCKERHUB_TAG\`
            - \`docker pull keekar/oscal_reports:$VERSION\`
          - **GitHub Container Registry**: https://ghcr.io/${{ github.repository_owner }}/oscal-report-generator:$VERSION
            - \`docker pull ghcr.io/${{ github.repository_owner }}/oscal-report-generator:$VERSION\`
          
          ## 🌐 Deployment URLs
          - **Blue Instance**: http://nas.keekar.com:3020
          - **Green Instance**: http://nas.keekar.com:3019
          
          ## 🔐 Credentials
          Download credentials from [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          
          **⚠️ IMPORTANT**: Change default passwords immediately after first login!
          
          ## 📋 Deployment Steps
          
          ### Option 1: Docker Hub (Easiest - Public Access)
          \`\`\`bash
          # Pull the latest/edge image from Docker Hub
          docker pull keekar/oscal_reports:$DOCKERHUB_TAG
          
          # Run the container
          docker run -d \\
            --name oscal-app \\
            -p 3020:3020 \\
            -v \$(pwd)/config:/app/config \\
            keekar/oscal_reports:$DOCKERHUB_TAG
          \`\`\`
          
          ### Option 2: TrueNAS Deployment (Recommended for Production)
          \`\`\`bash
          ssh mkesharw@NAS01
          cd /mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Green
          git pull origin main
          ./build_on_truenas.sh
          \`\`\`
          
          ### Option 3: GitHub Container Registry (GHCR)
          \`\`\`bash
          docker pull $IMAGE_TAG
          docker stop oscal-app || true
          docker rm oscal-app || true
          docker run -d \\
            --name oscal-app \\
            -p 3020:3020 \\
            -v \$(pwd)/config:/app/config \\
            $IMAGE_TAG
          \`\`\`
          
          ### Option 4: Docker Compose
          \`\`\`bash
          docker-compose pull
          docker-compose up -d
          \`\`\`
          
          ## ✅ Post-Deployment Checklist
          - [ ] Deploy to one instance (Blue or Green)
          - [ ] Verify health endpoint: \`curl http://nas.keekar.com:3020/health\`
          - [ ] Test login with new credentials
          - [ ] Check critical functionality
          - [ ] Monitor logs for errors
          
          ## 🔗 Quick Links
          - [View Changes](${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }})
          - [Docker Hub Image](https://hub.docker.com/r/keekar/oscal_reports)
          - [GHCR Image](${{ needs.build-and-push.outputs.registry-url }})
          - [Workflow Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          
          **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Deployed By**: ${{ github.actor }}
          EOF
          
          cat deployment-summary.md
      
      - name: 📤 Upload Deployment Summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary-${{ needs.build-and-push.outputs.version }}
          path: deployment-summary.md
          retention-days: 30
      
      - name: 📝 Create Job Summary
        run: |
          cat deployment-summary.md >> $GITHUB_STEP_SUMMARY
      
      - name: 📧 Notify via GitHub (Create Issue Comment if from PR)
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.build-and-push.outputs.version }}';
            const imageTag = '${{ needs.build-and-push.outputs.image-tag }}';
            
            const comment = `## 🚀 Deployment Successful!
            
            **Version**: ${version}
            **Docker Image**: \`${imageTag}\`
            
            ### 🌐 Test URLs:
            - Blue: http://nas.keekar.com:3020
            - Green: http://nas.keekar.com:3019
            
            ### 📋 Next Steps:
            1. SSH into TrueNAS
            2. Run: \`cd /mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Green && ./build_on_truenas.sh\`
            3. Test at http://nas.keekar.com:3020
            
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      # Email notifications (optional - requires email action)
      # Uncomment and configure if you want email notifications
      # - name: 📧 Send Email to Repository Owner
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 587
      #     username: ${{ secrets.SMTP_USERNAME }}
      #     password: ${{ secrets.SMTP_PASSWORD }}
      #     subject: '✅ OSCAL Report Generator v${{ needs.build-and-push.outputs.version }} Deployed'
      #     to: mukesh.kesharwani@adobe.com
      #     from: GitHub Actions <noreply@github.com>
      #     body: file://deployment-summary.md
      #     convert_markdown: true
      
      # Slack notifications (optional - requires webhook)
      # - name: 📱 Send Slack Notification
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     webhook-type: incoming-webhook
      #     payload: |
      #       {
      #         "text": "🚀 OSCAL Report Generator v${{ needs.build-and-push.outputs.version }} deployed!",
      #         "blocks": [
      #           {
      #             "type": "section",
      #             "text": {
      #               "type": "mrkdwn",
      #               "text": "*OSCAL Report Generator Deployment*\n\n*Version:* ${{ needs.build-and-push.outputs.version }}\n*Status:* ✅ Success\n*URLs:*\n• Blue: http://nas.keekar.com:3020\n• Green: http://nas.keekar.com:3019"
      #             }
      #           }
      #         ]
      #       }
  
  notify-failure:
    name: Notify Build/Deploy Failure
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, code-quality, version-check, integration-test]
    if: failure()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📝 Create Failure Summary
        run: |
          cat > failure-summary.md << EOF
          # ❌ Build/Test Failed - OSCAL Report Generator
          
          ## Failed Jobs:
          - Backend Tests: ${{ needs.backend-tests.result }}
          - Frontend Tests: ${{ needs.frontend-tests.result }}
          - Code Quality: ${{ needs.code-quality.result }}
          - Version Check: ${{ needs.version-check.result }}
          - Integration Test: ${{ needs.integration-test.result }}
          
          ## Details:
          - **Commit**: ${{ github.sha }}
          - **Author**: ${{ github.actor }}
          - **Branch**: ${{ github.ref_name }}
          
          ## Actions Required:
          1. Review [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          2. Fix failing tests/checks
          3. Push fixes to trigger new build
          
          ---
          **Failed At**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          
          cat failure-summary.md >> $GITHUB_STEP_SUMMARY

