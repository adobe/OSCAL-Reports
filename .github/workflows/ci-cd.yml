name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ###############################################################################
  # Backend Tests
  ###############################################################################
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: 🧪 Run backend unit tests
        working-directory: ./backend
        run: npm run test:unit
      
      - name: 🧪 Run backend integration tests
        working-directory: ./backend
        run: npm run test:integration
      
      - name: 📊 Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage
      
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  ###############################################################################
  # Frontend Tests
  ###############################################################################
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 7

  ###############################################################################
  # Code Quality & Security
  ###############################################################################
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install dependencies
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..
      
      - name: 🛡️ Run comprehensive validation
        run: |
          chmod +x test_cases/scripts/validate_best_practices.sh
          ./test_cases/scripts/validate_best_practices.sh
      
      - name: 🔄 Update best practices from npm audit
        run: |
          chmod +x test_cases/scripts/update_best_practices.sh
          ./test_cases/scripts/update_best_practices.sh
      
      - name: 🔒 Run npm audit (Backend)
        working-directory: ./backend
        run: |
          npm audit --audit-level=moderate || true
      
      - name: 🔒 Run npm audit (Frontend)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate || true

  ###############################################################################
  # Version Consistency Check
  ###############################################################################
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Check version synchronization
        run: |
          ROOT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          BACKEND_VERSION=$(grep '"version":' backend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          FRONTEND_VERSION=$(grep '"version":' frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          
          echo "Root version: $ROOT_VERSION"
          echo "Backend version: $BACKEND_VERSION"
          echo "Frontend version: $FRONTEND_VERSION"
          
          if [ "$ROOT_VERSION" != "$BACKEND_VERSION" ] || [ "$ROOT_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            exit 1
          else
            echo "✅ All versions synchronized: $ROOT_VERSION"
          fi

  ###############################################################################
  # Integration Test (Full Stack)
  ###############################################################################
  integration-test:
    name: Full Stack Integration
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install all dependencies
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..
      
      - name: 🚀 Start backend server
        working-directory: ./backend
        run: |
          npm start &
          echo $! > backend.pid
          sleep 10
      
      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: 🧪 Test health endpoint
        run: |
          curl -f http://localhost:3020/health || exit 1
      
      - name: 🛑 Stop backend server
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi

  ###############################################################################
  # Deployment (only on main branch)
  ###############################################################################
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, code-quality, version-check, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy notification
        run: |
          echo "🎉 All tests passed! Ready for deployment."
          echo "Version: $(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')"
      
      # Add your deployment steps here
      # Examples:
      # - Deploy to AWS
      # - Deploy to Azure
      # - Deploy to Docker registry
      # - Deploy to Kubernetes
      # - Create GitHub release

  ###############################################################################
  # Notification
  ###############################################################################
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, code-quality, version-check]
    if: always()
    
    steps:
      - name: 📢 Check status
        run: |
          if [ "${{ needs.backend-tests.result }}" == "success" ] && \
             [ "${{ needs.frontend-tests.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.version-check.result }}" == "success" ]; then
            echo "✅ All checks passed!"
          else
            echo "❌ Some checks failed"
            exit 1
          fi

