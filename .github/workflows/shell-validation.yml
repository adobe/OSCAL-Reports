# Runs only on the personal fork for fast feedback (ShellCheck, hooks, pass-sync tests).
# Shell validation for adobe/OSCAL-Reports.
# for checks that should fail first on personal Quality.
#
# Consolidated: one job runs ShellCheck + hooks + best-practices + dry-run (single checkout);
# ec2_automation tests stay parallel on a second runner.
name: Shell Script Validation

on:
  pull_request:
    branches:
      - Quality
      - Quality_Test
      - Quality
      - main
    paths:
      - '**.sh'
      - '.github/workflows/**.yml'
      - '.githooks/**'
  push:
    branches:
      - Quality
      - Quality_Test
      - Quality
    paths:
      - '**.sh'
      - '.github/workflows/**.yml'
      - '.githooks/**'

jobs:
  shell-gates:
    name: ShellCheck, hooks, best practices, dry-run
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐚 Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: 🔍 Find all shell scripts
        id: find_scripts
        run: |
          find . -type f -name "*.sh" ! -path "*/node_modules/*" ! -path "*/.git/*" | tee shell_scripts.txt
          echo "script_count=$(wc -l < shell_scripts.txt)" >> $GITHUB_OUTPUT

      - name: 🔍 Run ShellCheck on all scripts
        run: |
          FAILED=0
          PASSED=0
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            echo "Checking: $script"
            if shellcheck "$script"; then PASSED=$((PASSED + 1)); else FAILED=$((FAILED + 1)); fi
          done < shell_scripts.txt
          echo "Passed: $PASSED  Failed: $FAILED"
          [ "$FAILED" -eq 0 ] || exit 1

      - name: 🔍 Check bash in workflow files
        run: |
          for workflow in .github/workflows/*.yml; do
            if grep -n "cd .* &&" "$workflow" 2>/dev/null | grep -v "cd .* && cd"; then
              echo "⚠️ WARNING: cd && pattern in $workflow"
            fi
          done

      - name: 🔍 Git hooks syntax
        run: |
          if [ -d ".githooks" ]; then
            for hook in .githooks/*; do
              [ -f "$hook" ] && [ -x "$hook" ] || continue
              head -n 1 "$hook" | grep -q '^#!.*sh' || continue
              bash -n "$hook" || exit 1
            done
          fi

      - name: 🔍 Shell best practices (warnings)
        run: |
          for script in $(find . -type f -name "*.sh" ! -path "*/node_modules/*" ! -path "*/.git/*"); do
            [ -n "$script" ] || continue
            head -n 1 "$script" | grep -q "^#!" || echo "⚠️ no shebang: $script"
          done

      - name: 🔍 Script dry-run (--help)
        run: |
          for script in $(find . -type f -name "*.sh" ! -path "*/node_modules/*" ! -path "*/.git/*"); do
            [[ "$script" == *".githooks"* ]] || [[ "$script" == *"docker-entrypoint"* ]] && continue
            (bash "$script" --help 2>&1 || true) | grep -qi "usage\|help\|options" || true
          done

  ec2-automation-pass-sync-tests:
    name: ec2_automation Pass / Secrets Manager sync tests
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Run Pass ↔ Secrets Manager sync test suite
        run: |
          chmod +x test_cases/scripts/run-all-tests.sh
          ./test_cases/scripts/run-all-tests.sh --ec2-pass-sync-only

  shell-validation-summary:
    name: Shell Validation Summary
    runs-on: ubuntu-latest
    needs: [shell-gates, ec2-automation-pass-sync-tests]
    if: always() && github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🐚 Shell Script Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Shell gates (ShellCheck + hooks + practices + dry-run): ${{ needs.shell-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ec2_automation Pass/Secrets sync tests: ${{ needs.ec2-automation-pass-sync-tests.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.shell-gates.result }}" != "success" ]; then
            echo "❌ **Shell gates failed.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Shell gates passed.**" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.ec2-automation-pass-sync-tests.result }}" != "success" ]; then
            echo "❌ **Pass/Secrets sync tests failed.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ❌ Fail workflow when shell gates failed
        if: needs.shell-gates.result != 'success' || needs.ec2-automation-pass-sync-tests.result != 'success'
        run: |
          echo "Shell validation failed (shell-gates=${{ needs.shell-gates.result }}, pass-sync=${{ needs.ec2-automation-pass-sync-tests.result }})" >&2
          exit 1
