name: Deploy to Azure Web App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'staging'
  # Note: Auto-deployment disabled. Requires Azure credentials.
  # Use workflow_dispatch (manual trigger) instead.
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**.md'

jobs:
  ###############################################################################
  # Build and Push Docker Image
  ###############################################################################
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📝 Extract version
        id: version
        run: |
          VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📝 Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oscal-report-generator
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=ref,event=branch
            type=sha
            latest
      
      - name: 📦 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
            PORT=3020
  
  ###############################################################################
  # Deploy to Azure Web App
  ###############################################################################
  deploy-azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: ${{ inputs.environment || 'production' }}
      # Note: Environment URL cannot use secrets. Set manually in GitHub UI if needed.
    
    steps:
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ghcr.io/${{ github.repository_owner }}/oscal-report-generator:latest
      
      - name: 📝 Deployment Summary
        run: |
          cat > deployment-summary.md << EOF
          # ✅ Azure Deployment Successful
          
          ## Deployment Details
          - **Version**: ${{ needs.build.outputs.version }}
          - **Environment**: ${{ inputs.environment || 'production' }}
          - **URL**: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net
          - **Image**: ghcr.io/${{ github.repository_owner }}/oscal-report-generator:latest
          
          ## Access Application
          🌐 **URL**: [https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net](https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net)
          
          ## Health Check
          \`\`\`bash
          curl https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health
          \`\`\`
          
          ## Rollback (if needed)
          Go to Azure Portal → App Service → Deployment Center → Redeploy previous version
          
          ---
          **Deployed By**: ${{ github.actor }}
          **Deployment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          
          cat deployment-summary.md >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload Deployment Summary
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-summary-${{ needs.build.outputs.version }}
          path: deployment-summary.md
          retention-days: 30

  ###############################################################################
  # Notify Deployment Success
  ###############################################################################
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy-azure]
    if: always()
    
    steps:
      - name: 📧 Send Notification
        run: |
          if [ "${{ needs.deploy-azure.result }}" == "success" ]; then
            echo "✅ Deployment to Azure successful!"
            echo "🌐 URL: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          else
            echo "❌ Deployment failed"
            echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
