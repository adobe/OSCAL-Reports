# Mirror personal branch Quality onto Adobe branch Quality (replaces Development + Pre_Prod direct sync).
#
# Triggers:
#   1) repository_dispatch (quality-sync) — fired by personal repo on push to Quality
#   2) workflow_dispatch — manual fallback on Adobe repo
#   3) schedule — safety net if dispatch fails
#
# Adobe job: checkout Quality, fetch personal Quality, fast-forward, push.
# Secrets (Adobe): PERSONAL_REPO_READ_TOKEN, optional ADOBE_REPO_PUSH_TOKEN

name: Sync Quality to Adobe Quality

on:
  repository_dispatch:
    types:
      - quality-sync
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

concurrency:
  group: quality-to-adobe-quality
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-forward-on-adobe:
    name: Fast-forward Adobe Quality from personal Quality
    if: github.repository == 'AdobeManagedServices/OSCAL-Reports'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ADOBE_REPO_PUSH_TOKEN || github.token }}

      - name: Configure git author
        run: |
          git config user.name "Mukesh Kesharwani"
          git config user.email "mukesh.kesharwani@adobe.com"

      - name: Verify PAT can read personal repository
        env:
          PERSONAL_REPO_READ_TOKEN: ${{ secrets.PERSONAL_REPO_READ_TOKEN }}
          PERSONAL_REPO_FULL_NAME: ${{ vars.PERSONAL_SOURCE_REPO }}
        run: |
          set -euo pipefail
          REPO="${PERSONAL_REPO_FULL_NAME:-keekar2022/OSCAL-Reports}"
          if [ -z "${PERSONAL_REPO_READ_TOKEN}" ]; then
            echo '::error::PERSONAL_REPO_READ_TOKEN is empty. Add it under Settings → Secrets and variables → Actions on the Adobe repo.'
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${PERSONAL_REPO_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}")"
          if [ "${code}" != "200" ]; then
            echo "::error::GitHub API returned HTTP ${code} for ${REPO}. Use a PAT from your personal GitHub user with read access; authorize SSO if required."
            exit 1
          fi
          echo "OK: token can read ${REPO}."

      - name: Fast-forward merge personal Quality into Adobe Quality
        env:
          PERSONAL_REPO_READ_TOKEN: ${{ secrets.PERSONAL_REPO_READ_TOKEN }}
          PERSONAL_REPO_FULL_NAME: ${{ vars.PERSONAL_SOURCE_REPO }}
          ADOBE_TARGET_BRANCH: Quality
        run: |
          chmod +x scripts/git/ff-sync-adobe-from-personal-quality.sh
          ./scripts/git/ff-sync-adobe-from-personal-quality.sh

      - name: Push Adobe Quality
        run: git push origin Quality

      - name: Sync summary
        run: |
          {
            echo "## Quality mirror sync"
            echo "- Source: personal \`Quality\`"
            echo "- Target: Adobe \`Quality\` @ \$(git rev-parse --short HEAD)"
            echo "- Trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
