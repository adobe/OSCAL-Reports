name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'staging'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  ###############################################################################
  # Build and Push Docker Image
  ###############################################################################
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📝 Extract version
        id: version
        run: |
          VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      
      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: 📦 Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: oscal-report-generator
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --build-arg BUILD_TIMESTAMP="$(date -Iseconds)" \
            --build-arg PORT=3020 .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
  
  ###############################################################################
  # Deploy to AWS ECS
  ###############################################################################
  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: ${{ inputs.environment || 'production' }}
      # Note: Environment URL cannot use secrets. Set manually in GitHub UI if needed.
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      
      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: 📝 Fill in new image ID in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.json
          container-name: oscal-report-generator
          image: ${{ steps.login-ecr.outputs.registry }}/oscal-report-generator:latest
      
      - name: 🚀 Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
      
      - name: 📝 Deployment Summary
        run: |
          cat > deployment-summary.md << EOF
          # ✅ AWS ECS Deployment Successful
          
          ## Deployment Details
          - **Version**: ${{ needs.build.outputs.version }}
          - **Environment**: ${{ inputs.environment || 'production' }}
          - **Cluster**: ${{ secrets.ECS_CLUSTER_NAME }}
          - **Service**: ${{ secrets.ECS_SERVICE_NAME }}
          - **Region**: ${{ secrets.AWS_REGION || 'us-east-1' }}
          
          ## Access Application
          🌐 **URL**: [http://${{ secrets.AWS_LOAD_BALANCER_DNS }}](http://${{ secrets.AWS_LOAD_BALANCER_DNS }})
          
          ## Health Check
          \`\`\`bash
          curl http://${{ secrets.AWS_LOAD_BALANCER_DNS }}/health
          \`\`\`
          
          ## View Logs
          \`\`\`bash
          aws ecs list-tasks --cluster ${{ secrets.ECS_CLUSTER_NAME }} --service-name ${{ secrets.ECS_SERVICE_NAME }}
          aws logs tail /ecs/oscal-report-generator --follow
          \`\`\`
          
          ---
          **Deployed By**: ${{ github.actor }}
          **Deployment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          
          cat deployment-summary.md >> $GITHUB_STEP_SUMMARY

  ###############################################################################
  # Notify Deployment Success
  ###############################################################################
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy-aws]
    if: always()
    
    steps:
      - name: 📧 Send Notification
        run: |
          if [ "${{ needs.deploy-aws.result }}" == "success" ]; then
            echo "✅ Deployment to AWS ECS successful!"
            echo "🌐 URL: http://${{ secrets.AWS_LOAD_BALANCER_DNS }}"
          else
            echo "❌ Deployment failed"
            echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
