# Concept: Mukesh Kesharwani
# Contact: mukesh.kesharwani@adobe.com
#
# Quality gates for adobe/OSCAL-Reports (branch: Main).

name: Quality Gates

on:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test:unit

  catalogue-fetch-release:
    name: OSCAL catalogue fetch (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run catalogue manifest + live fetch tests
        working-directory: backend
        run: npm run test:catalogues
        timeout-minutes: 15

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Audit backend
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  package-version-consistency:
    name: Package version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          ROOT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          BACKEND_VERSION=$(grep '"version":' backend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          FRONTEND_VERSION=$(grep '"version":' frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ "$ROOT_VERSION" != "$BACKEND_VERSION" ] || [ "$ROOT_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "Version mismatch: root=$ROOT_VERSION backend=$BACKEND_VERSION frontend=$FRONTEND_VERSION" >&2
            exit 1
          fi
          echo "Consistent version: $ROOT_VERSION"

  docker-build-smoke-test:
    name: Docker build + startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: oscal-reports:quality-gate
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches builds that succeed but crash on startup (e.g. the v1.8.00
      # regression where config/constants/ was copied into the discarded
      # frontend-builder stage and never into the production stage — the
      # image built and pushed fine, but every container crash-looped).
      - name: Boot image and verify /health + shared config
        run: ./scripts/docker-smoke-test.sh oscal-reports:quality-gate

  quality-gates-summary:
    name: Quality Gates Summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend-unit-tests
      - catalogue-fetch-release
      - frontend-build
      - npm-audit
      - package-version-consistency
      - docker-build-smoke-test
    if: always() && github.repository == 'adobe/OSCAL-Reports'

    steps:
      - name: Generate summary
        run: |
          echo "## Quality Gates Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend unit tests: ${{ needs.backend-unit-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSCAL catalogue fetch: ${{ needs.catalogue-fetch-release.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend build: ${{ needs.frontend-build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm audit: ${{ needs.npm-audit.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version consistency: ${{ needs.package-version-consistency.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker build + smoke test: ${{ needs.docker-build-smoke-test.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when any gate failed
        if: |
          needs.backend-unit-tests.result != 'success' ||
          needs.catalogue-fetch-release.result != 'success' ||
          needs.frontend-build.result != 'success' ||
          needs.npm-audit.result != 'success' ||
          needs.package-version-consistency.result != 'success' ||
          needs.docker-build-smoke-test.result != 'success'
        run: |
          echo "One or more quality gates failed." >&2
          exit 1
