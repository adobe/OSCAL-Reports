name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - blue
          - green
          - both
        default: 'green'
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        type: string
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        type: boolean
        default: false

jobs:
  ###############################################################################
  # Pre-deployment Tests (Optional)
  ###############################################################################
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 📦 Install dependencies
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..
      
      - name: 🧪 Run backend tests
        working-directory: ./backend
        run: |
          npm run test:unit
          npm run test:integration
      
      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
  
  ###############################################################################
  # Build and Deploy
  ###############################################################################
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [tests]
    if: always() && (needs.tests.result == 'success' || inputs.skip_tests)
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📝 Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📦 Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            PORT=${{ inputs.environment == 'blue' && '3020' || '3019' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/oscal-report-generator:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/oscal-report-generator:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🚀 Generate Deployment Instructions
        id: deploy-instructions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ENV="${{ inputs.environment }}"
          
          if [ "$ENV" = "blue" ]; then
            PORT="3020"
            INSTANCE_PATH="/mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Blue"
          elif [ "$ENV" = "green" ]; then
            PORT="3019"
            INSTANCE_PATH="/mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Green"
          fi
          
          cat > deployment-instructions.md << EOF
          # 🚀 Manual Deployment Instructions
          
          ## Deployment Configuration
          - **Environment**: $ENV
          - **Version**: $VERSION
          - **Port**: $PORT
          - **URL**: http://nas.keekar.com:$PORT
          
          ## TrueNAS Deployment
          
          ### SSH into TrueNAS:
          \`\`\`bash
          ssh mkesharw@NAS01
          \`\`\`
          
          ### Deploy to $ENV instance:
          \`\`\`bash
          cd $INSTANCE_PATH
          git pull origin main
          ./build_on_truenas.sh
          \`\`\`
          
          ### Verify Deployment:
          \`\`\`bash
          # Check container status
          docker ps | grep oscal
          
          # Check health
          curl http://localhost:$PORT/health
          
          # View logs
          docker logs oscal-report-generator-$ENV
          \`\`\`
          
          ## Alternative: Direct Docker Pull
          
          \`\`\`bash
          # Pull latest image
          docker pull ghcr.io/${{ github.repository_owner }}/oscal-report-generator:$VERSION
          
          # Stop existing container
          docker stop oscal-report-generator-$ENV || true
          docker rm oscal-report-generator-$ENV || true
          
          # Run new container
          docker run -d \\
            --name oscal-report-generator-$ENV \\
            -p $PORT:$PORT \\
            -v $INSTANCE_PATH/config:/app/config \\
            --restart unless-stopped \\
            ghcr.io/${{ github.repository_owner }}/oscal-report-generator:$VERSION
          \`\`\`
          
          ## Testing
          
          1. **Health Check**: http://nas.keekar.com:$PORT/health
          2. **Login Page**: http://nas.keekar.com:$PORT
          3. **Check credentials** in workflow artifacts
          
          ## Rollback (if needed)
          
          \`\`\`bash
          cd $INSTANCE_PATH
          git log --oneline -5  # Find previous version
          git checkout <previous-commit>
          ./build_on_truenas.sh
          \`\`\`
          
          ---
          
          **Deployed By**: ${{ github.actor }}
          **Deployment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Workflow**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          
          cat deployment-instructions.md
          cat deployment-instructions.md >> $GITHUB_STEP_SUMMARY
          
          echo "deployment-url=http://nas.keekar.com:$PORT" >> $GITHUB_OUTPUT
      
      - name: 📤 Upload Deployment Instructions
        uses: actions/upload-artifact@v4
        with:
          name: deployment-instructions-${{ inputs.environment }}-${{ steps.version.outputs.version }}
          path: deployment-instructions.md
          retention-days: 30
  
  ###############################################################################
  # Deploy to Both Environments
  ###############################################################################
  deploy-both:
    name: Deploy to Both Environments
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == 'both' }}
    needs: [tests]
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📝 Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: 🚀 Generate Deployment Instructions for Both
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          cat > deployment-instructions-both.md << EOF
          # 🚀 Dual Environment Deployment
          
          ## Deployment Configuration
          - **Version**: $VERSION
          - **Blue URL**: http://nas.keekar.com:3020
          - **Green URL**: http://nas.keekar.com:3019
          
          ## Deploy to Both Environments
          
          ### Deploy Green (Port 3019):
          \`\`\`bash
          ssh mkesharw@NAS01
          cd /mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Green
          git pull origin main
          ./build_on_truenas.sh
          \`\`\`
          
          ### Test Green:
          \`\`\`bash
          curl http://nas.keekar.com:3019/health
          \`\`\`
          
          ### Deploy Blue (Port 3020):
          \`\`\`bash
          cd /mnt/pool1/Documents/KACI-Apps/OSCAL-Report-Generator-Blue
          git pull origin main
          ./build_on_truenas.sh
          \`\`\`
          
          ### Test Blue:
          \`\`\`bash
          curl http://nas.keekar.com:3020/health
          \`\`\`
          
          ## Verification
          - [ ] Green instance running: http://nas.keekar.com:3019
          - [ ] Blue instance running: http://nas.keekar.com:3020
          - [ ] Both health endpoints responding
          - [ ] Login works on both
          - [ ] Critical features tested
          
          ---
          
          **Deployed By**: ${{ github.actor }}
          **Deployment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          
          cat deployment-instructions-both.md
          cat deployment-instructions-both.md >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload Instructions
        uses: actions/upload-artifact@v4
        with:
          name: deployment-instructions-both-${{ steps.version.outputs.version }}
          path: deployment-instructions-both.md
          retention-days: 30
  
  ###############################################################################
  # Notification
  ###############################################################################
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy, deploy-both]
    if: always()
    
    steps:
      - name: 📧 Notify Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] || [ "${{ needs.deploy-both.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
            echo "Check workflow artifacts for detailed instructions."
          else
            echo "❌ Deployment failed or was skipped."
            echo "Review workflow logs for details."
          fi
