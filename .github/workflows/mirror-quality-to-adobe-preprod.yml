# Optional full auto: on push to Quality (personal repo), push same commit to Adobe Pre_Prod.
# Requires a self-hosted runner with labels [self-hosted, oscal-mirror] and secret ADOBE_REPO_PUSH_TOKEN.
# Skipped on Adobe repo clone. If no runner is registered, jobs queue until a runner is online—use
# workflow_dispatch after adding a runner, or rely on sync-personal-quality-to-adobe-preprod.yml on Adobe.

name: Mirror Quality to Adobe Pre_Prod

on:
  push:
    branches:
      - Quality
  workflow_dispatch:

concurrency:
  group: mirror-quality-to-adobe-preprod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push Quality to Adobe Pre_Prod
    if: github.repository == 'keekar2022/OSCAL-Reports'
    runs-on: [self-hosted, oscal-mirror]
    steps:
      - name: Checkout Quality
        uses: actions/checkout@v4
        with:
          ref: Quality
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "Mukesh Kesharwani"
          git config user.email "mukesh.kesharwani@adobe.com"

      - name: Push to Adobe Pre_Prod
        env:
          ADOBE_REPO_PUSH_TOKEN: ${{ secrets.ADOBE_REPO_PUSH_TOKEN }}
        run: |
          if [ -z "${ADOBE_REPO_PUSH_TOKEN}" ]; then
            echo "ADOBE_REPO_PUSH_TOKEN is not set; cannot push to Adobe." >&2
            exit 1
          fi
          git remote remove adobe 2>/dev/null || true
          git remote add adobe "https://x-access-token:${ADOBE_REPO_PUSH_TOKEN}@github.com/AdobeManagedServices/OSCAL-Reports.git"
          git push adobe HEAD:Pre_Prod
