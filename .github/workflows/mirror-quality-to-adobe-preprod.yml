# Optional full auto: on push to Quality (personal repo), push same commit to Adobe Pre_Prod.
# Requires a self-hosted runner with labels [self-hosted, oscal-mirror] and secret ADOBE_REPO_PUSH_TOKEN.
# Skipped on Adobe repo clone. If no runner is registered, jobs queue until timeout—use
# workflow_dispatch after adding a runner, or rely on sync-personal-quality-to-adobe-preprod.yml on Adobe.

name: Mirror Quality to Adobe Pre_Prod

on:
  push:
    branches:
      - Quality
  workflow_dispatch:

concurrency:
  group: mirror-quality-to-adobe-preprod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push Quality to Adobe Pre_Prod
    if: github.repository == 'keekar2022/OSCAL-Reports'
    runs-on: [self-hosted, oscal-mirror]
    timeout-minutes: 30
    steps:
      - name: Self-hosted runner context
        run: |
          echo "Using self-hosted runner labels: self-hosted, oscal-mirror"
          echo "If this job queues longer than 30 minutes, the runner is offline."
          echo "Fallback: AdobeManagedServices/OSCAL-Reports → Actions → Sync Quality to Adobe Pre_Prod → Run workflow"

      - name: Checkout Quality
        uses: actions/checkout@v4
        with:
          ref: Quality
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "Mukesh Kesharwani"
          git config user.email "mukesh.kesharwani@adobe.com"

      - name: Push to Adobe Pre_Prod
        env:
          ADOBE_REPO_PUSH_TOKEN: ${{ secrets.ADOBE_REPO_PUSH_TOKEN }}
        run: |
          if [ -z "${ADOBE_REPO_PUSH_TOKEN}" ]; then
            echo "::error::ADOBE_REPO_PUSH_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, or use Adobe-side workflow_dispatch (Sync Quality to Adobe Pre_Prod on AdobeManagedServices/OSCAL-Reports)."
            exit 1
          fi
          git remote remove adobe 2>/dev/null || true
          git remote add adobe "https://x-access-token:${ADOBE_REPO_PUSH_TOKEN}@github.com/AdobeManagedServices/OSCAL-Reports.git"
          git push adobe HEAD:Pre_Prod

  mirror-fallback-hint:
    name: Adobe mirror fallback instructions
    runs-on: ubuntu-latest
    needs: [mirror]
    if: always() && github.repository == 'keekar2022/OSCAL-Reports' && github.event_name == 'push'

    steps:
      - name: Post mirror guidance
        run: |
          {
            echo "## Quality → Adobe Pre_Prod mirror"
            if [ "${{ needs.mirror.result }}" = "success" ]; then
              echo "Self-hosted mirror push succeeded."
            else
              echo "Self-hosted mirror push result: **${{ needs.mirror.result }}**"
              echo ""
              echo "If the mirror job was **queued** or **timed out**, use the Adobe-side pull sync instead:"
              echo "1. Open **AdobeManagedServices/OSCAL-Reports** → Actions"
              echo "2. Run **Sync Quality to Adobe Pre_Prod** (workflow_dispatch)"
              echo "3. Ensure \`PERSONAL_REPO_READ_TOKEN\` and \`ADOBE_REPO_PUSH_TOKEN\` are set on the Adobe repo"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
