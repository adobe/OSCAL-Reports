<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title desc">
  <title id="title">Compliance Automation OSCAL Report Generator launch banner</title>
  <desc id="desc">A futuristic compliance command centre with framework nodes, a holographic compliance engine, audit metrics, and a community testing call to action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040d1b"/>
      <stop offset="0.55" stop-color="#071c2c"/>
      <stop offset="1" stop-color="#031017"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="65%">
      <stop offset="0" stop-color="#0b7c9d" stop-opacity=".36"/>
      <stop offset=".45" stop-color="#06465e" stop-opacity=".12"/>
      <stop offset="1" stop-color="#02121f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102d42" stop-opacity=".94"/>
      <stop offset="1" stop-color="#071522" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#56f2ff" stop-opacity="0"/>
      <stop offset=".4" stop-color="#56f2ff"/>
      <stop offset="1" stop-color="#0bb7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55f6e3"/>
      <stop offset="1" stop-color="#10a9ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b6680" stroke-opacity=".16" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#54e7ed" fill-opacity=".2"/>
    </pattern>
    <pattern id="microGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#73eefa" stroke-opacity=".1"/>
    </pattern>
    <clipPath id="screenClip"><rect x="338" y="150" width="690" height="418" rx="18"/></clipPath>
  </defs>

  <rect width="1366" height="768" fill="url(#bg)"/>
  <rect width="1366" height="768" fill="url(#halo)"/>
  <path d="M0 616H1366M0 650H1366M0 684H1366M0 718H1366" stroke="#1e8295" stroke-opacity=".16"/>
  <rect y="80" width="1366" height="688" fill="url(#grid)" opacity=".82"/>
  <path d="M0 110H1366M0 142H1366" stroke="url(#cyanLine)" opacity=".48"/>

